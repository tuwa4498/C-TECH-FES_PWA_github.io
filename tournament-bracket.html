  <script>
    const INITIAL_STATE = {"title":"APEX FIGHT NIGHT #01","format":"double","playerCount":8,"podiumCount":3,"players":["KAZUYA","JIN","RYU","KEN","CHUN-LI","GUILE","LUKE","CAMMY"],"results":{}};
    const state = {
      title: INITIAL_STATE.title,
      format: INITIAL_STATE.format,
      playerCount: INITIAL_STATE.playerCount,
      podiumCount: INITIAL_STATE.podiumCount,
      players: [...INITIAL_STATE.players],
      results: { ...INITIAL_STATE.results },
      broadcastMode: false
    };

    try {
      const saved = localStorage.getItem('apex_bracket_standalone_v1');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed && parsed.title) Object.assign(state, parsed, { broadcastMode: false });
      }
    } catch (_) {}

    function persist() {
      try {
        localStorage.setItem('apex_bracket_standalone_v1', JSON.stringify({
          title: state.title,
          format: state.format,
          playerCount: state.playerCount,
          podiumCount: state.podiumCount,
          players: state.players,
          results: state.results
        }));
      } catch (_) {}
    }

    function nextPow2(n) { let p = 2; while (p < n) p *= 2; return p; }
    function seedOrder(size) {
      let s = [1, 2];
      while (s.length < size) {
        const next = s.length * 2;
        const out = [];
        for (const x of s) out.push(x, next + 1 - x);
        s = out;
      }
      return s;
    }

    function resolveMatch(m, all) {
      if (m.p1IsBye && m.p2IsBye) {
        m.isAutoBye = true;
        if (m.nextWinTarget && all[m.nextWinTarget.matchId]) {
          all[m.nextWinTarget.matchId][m.nextWinTarget.slot === 1 ? 'p1IsBye' : 'p2IsBye'] = true;
        }
        if (m.nextLoseTarget && all[m.nextLoseTarget.matchId]) {
          all[m.nextLoseTarget.matchId][m.nextLoseTarget.slot === 1 ? 'p1IsBye' : 'p2IsBye'] = true;
        }
        return;
      }
      if (m.p1IsBye && !m.p2IsBye) {
        m.isAutoBye = true;
        if (m.p2) {
          m.effectiveWinner = 2; m.winnerPlayer = m.p2;
          if (m.nextWinTarget && all[m.nextWinTarget.matchId]) {
            all[m.nextWinTarget.matchId][m.nextWinTarget.slot === 1 ? 'p1' : 'p2'] = m.p2;
          }
        }
        if (m.nextLoseTarget && all[m.nextLoseTarget.matchId]) {
          all[m.nextLoseTarget.matchId][m.nextLoseTarget.slot === 1 ? 'p1IsBye' : 'p2IsBye'] = true;
        }
        return;
      }
      if (m.p2IsBye && !m.p1IsBye) {
        m.isAutoBye = true;
        if (m.p1) {
          m.effectiveWinner = 1; m.winnerPlayer = m.p1;
          if (m.nextWinTarget && all[m.nextWinTarget.matchId]) {
            all[m.nextWinTarget.matchId][m.nextWinTarget.slot === 1 ? 'p1' : 'p2'] = m.p1;
          }
        }
        if (m.nextLoseTarget && all[m.nextLoseTarget.matchId]) {
          all[m.nextLoseTarget.matchId][m.nextLoseTarget.slot === 1 ? 'p1IsBye' : 'p2IsBye'] = true;
        }
        return;
      }
      if (m.p1 && m.p2 && (m.selectedWinner === 1 || m.selectedWinner === 2)) {
        m.effectiveWinner = m.selectedWinner;
        m.winnerPlayer = m.selectedWinner === 1 ? m.p1 : m.p2;
        m.loserPlayer = m.selectedWinner === 1 ? m.p2 : m.p1;
        if (m.nextWinTarget && all[m.nextWinTarget.matchId]) {
          all[m.nextWinTarget.matchId][m.nextWinTarget.slot === 1 ? 'p1' : 'p2'] = m.winnerPlayer;
        }
        if (m.nextLoseTarget && all[m.nextLoseTarget.matchId]) {
          all[m.nextLoseTarget.matchId][m.nextLoseTarget.slot === 1 ? 'p1' : 'p2'] = m.loserPlayer;
        }
      }
    }

    function evaluateBracket() {
      const maxAllowed = state.format === 'double' ? 8 : 32;
      const count = Math.max(2, Math.min(maxAllowed, state.playerCount));
      const clean = Array.from({ length: count }, (_, i) => ({
        seed: i + 1,
        name: (state.players[i] || '').trim() || ('Player ' + (i + 1))
      }));
      const bSize = nextPow2(count);
      const sOrder = seedOrder(bSize);
      const matches = {};
      const orderedIds = [];
      const reg = (m) => { matches[m.id] = m; orderedIds.push(m.id); };

      if (state.format === 'single') {
        const totalRounds = Math.log2(bSize);
        const isSym = count >= 16;
        for (let r = 0; r < totalRounds; r++) {
          const mCount = bSize / Math.pow(2, r + 1);
          const rem = totalRounds - r;
          const label = rem === 1 ? 'FINAL' : rem === 2 ? 'SEMIFINALS' : rem === 3 ? 'QUARTERFINALS' : ('ROUND ' + (r + 1));
          for (let m = 0; m < mCount; m++) {
            const id = 'S-R' + r + '-M' + m;
            const side = isSym ? (r === totalRounds - 1 ? 'center' : (m < mCount / 2 ? 'left' : 'right')) : 'left';
            reg({
              id, bracket: 'single', roundIndex: r, matchIndex: m, roundLabel: label, side,
              p1: r === 0 && sOrder[m*2] <= count ? clean[sOrder[m*2]-1] : null,
              p2: r === 0 && sOrder[m*2+1] <= count ? clean[sOrder[m*2+1]-1] : null,
              p1IsBye: r === 0 && sOrder[m*2] > count,
              p2IsBye: r === 0 && sOrder[m*2+1] > count,
              selectedWinner: state.results[id] || null, effectiveWinner: null, isAutoBye: false,
              winnerPlayer: null, loserPlayer: null,
              nextWinTarget: r < totalRounds - 1 ? { matchId: 'S-R' + (r+1) + '-M' + Math.floor(m/2), slot: m % 2 === 0 ? 1 : 2 } : null,
              nextLoseTarget: state.podiumCount === 3 && totalRounds >= 2 && r === totalRounds - 2 ? { matchId: 'S-3RD', slot: m === 0 ? 1 : 2 } : null
            });
          }
        }
        if (state.podiumCount === 3 && totalRounds >= 2) {
          reg({
            id: 'S-3RD', bracket: 'third', roundIndex: totalRounds - 1, matchIndex: 1, roundLabel: '3RD PLACE',
            side: isSym ? 'center' : 'left', p1: null, p2: null, p1IsBye: false, p2IsBye: false,
            selectedWinner: state.results['S-3RD'] || null, effectiveWinner: null, isAutoBye: false,
            winnerPlayer: null, loserPlayer: null, nextWinTarget: null, nextLoseTarget: null
          });
        }
        for (const id of orderedIds) resolveMatch(matches[id], matches);
        const fin = matches['S-R' + (totalRounds - 1) + '-M0'];
        return {
          format: 'single', bSize, isSym, matches,
          podium: {
            first: fin ? fin.winnerPlayer : null,
            second: fin ? fin.loserPlayer : null,
            third: state.podiumCount === 3 && matches['S-3RD'] ? matches['S-3RD'].winnerPlayer : null
          }
        };
      }

      // Double Elimination (bSize 2, 4, 8)
      if (bSize === 2) {
        reg({ id: 'W-R0-M0', bracket: 'winners', roundLabel: 'WINNERS FINAL', p1: clean[0], p2: clean[1], p1IsBye: false, p2IsBye: false, selectedWinner: state.results['W-R0-M0'] || null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'GF-1', slot: 1 }, nextLoseTarget: { matchId: 'GF-1', slot: 2 } });
      } else if (bSize === 4) {
        for (let m = 0; m < 2; m++) {
          const s1 = sOrder[m*2], s2 = sOrder[m*2+1];
          reg({ id: 'W-R0-M'+m, bracket: 'winners', roundLabel: 'WINNERS SF', p1: s1<=count?clean[s1-1]:null, p2: s2<=count?clean[s2-1]:null, p1IsBye: s1>count, p2IsBye: s2>count, selectedWinner: state.results['W-R0-M'+m]||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'W-R1-M0', slot: m+1 }, nextLoseTarget: { matchId: 'L-R0-M0', slot: m+1 } });
        }
        reg({ id: 'W-R1-M0', bracket: 'winners', roundLabel: 'WINNERS FINAL', p1: null, p2: null, p1IsBye: false, p2IsBye: false, selectedWinner: state.results['W-R1-M0']||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'GF-1', slot: 1 }, nextLoseTarget: { matchId: 'L-R1-M0', slot: 1 } });
        reg({ id: 'L-R0-M0', bracket: 'losers', roundLabel: 'LOSERS R1', p1: null, p2: null, p1IsBye: false, p2IsBye: false, selectedWinner: state.results['L-R0-M0']||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'L-R1-M0', slot: 2 }, nextLoseTarget: null });
        reg({ id: 'L-R1-M0', bracket: 'losers', roundLabel: 'LOSERS FINAL', p1: null, p2: null, p1IsBye: false, p2IsBye: false, selectedWinner: state.results['L-R1-M0']||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'GF-1', slot: 2 }, nextLoseTarget: null });
      } else {
        for (let m = 0; m < 4; m++) {
          const s1 = sOrder[m*2], s2 = sOrder[m*2+1];
          reg({ id: 'W-R0-M'+m, bracket: 'winners', roundLabel: 'WINNERS QF', p1: s1<=count?clean[s1-1]:null, p2: s2<=count?clean[s2-1]:null, p1IsBye: s1>count, p2IsBye: s2>count, selectedWinner: state.results['W-R0-M'+m]||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'W-R1-M'+Math.floor(m/2), slot: m%2===0?1:2 }, nextLoseTarget: { matchId: 'L-R0-M'+Math.floor(m/2), slot: m%2===0?1:2 } });
        }
        for (let m = 0; m < 2; m++) {
          reg({ id: 'W-R1-M'+m, bracket: 'winners', roundLabel: 'WINNERS SF', p1: null, p2: null, p1IsBye: false, p2IsBye: false, selectedWinner: state.results['W-R1-M'+m]||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'W-R2-M0', slot: m+1 }, nextLoseTarget: { matchId: 'L-R1-M'+(m===0?1:0), slot: 1 } });
        }
        reg({ id: 'W-R2-M0', bracket: 'winners', roundLabel: 'WINNERS FINAL', p1: null, p2: null, p1IsBye: false, p2IsBye: false, selectedWinner: state.results['W-R2-M0']||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'GF-1', slot: 1 }, nextLoseTarget: { matchId: 'L-R3-M0', slot: 1 } });
        for (let m = 0; m < 2; m++) {
          reg({ id: 'L-R0-M'+m, bracket: 'losers', roundLabel: 'LOSERS R1', p1: null, p2: null, p1IsBye: false, p2IsBye: false, selectedWinner: state.results['L-R0-M'+m]||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'L-R1-M'+m, slot: 2 }, nextLoseTarget: null });
        }
        for (let m = 0; m < 2; m++) {
          reg({ id: 'L-R1-M'+m, bracket: 'losers', roundLabel: 'LOSERS QF', p1: null, p2: null, p1IsBye: false, p2IsBye: false, selectedWinner: state.results['L-R1-M'+m]||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'L-R2-M0', slot: m+1 }, nextLoseTarget: null });
        }
        reg({ id: 'L-R2-M0', bracket: 'losers', roundLabel: 'LOSERS SF', p1: null, p2: null, p1IsBye: false, p2IsBye: false, selectedWinner: state.results['L-R2-M0']||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'L-R3-M0', slot: 2 }, nextLoseTarget: null });
        reg({ id: 'L-R3-M0', bracket: 'losers', roundLabel: 'LOSERS FINAL', p1: null, p2: null, p1IsBye: false, p2IsBye: false, selectedWinner: state.results['L-R3-M0']||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: { matchId: 'GF-1', slot: 2 }, nextLoseTarget: null });
      }
      reg({ id: 'GF-1', bracket: 'grand_final', roundLabel: 'GRAND FINAL', p1: null, p2: null, p1IsBye: false, p2IsBye: false, selectedWinner: state.results['GF-1']||null, effectiveWinner: null, isAutoBye: false, winnerPlayer: null, loserPlayer: null, nextWinTarget: null, nextLoseTarget: null });
      reg({ id: 'GF-2', bracket: 'grand_final', roundLabel: 'GF RESET', p1: null, p2: null, p1IsBye: false, p2IsBye: false, selectedWinner: state.results['GF-2']||null, effectiveWinner: null, isAutoBye: false, isDisabled: true, winnerPlayer: null, loserPlayer: null, nextWinTarget: null, nextLoseTarget: null });

      for (const id of orderedIds.filter(x => x.startsWith('W-'))) resolveMatch(matches[id], matches);
      for (const id of orderedIds.filter(x => x.startsWith('L-'))) resolveMatch(matches[id], matches);
      const gf1 = matches['GF-1'], gf2 = matches['GF-2'];
      resolveMatch(gf1, matches);
      if (gf1.effectiveWinner === 2 && gf1.p1 && gf1.p2) {
        gf2.isDisabled = false;
        gf2.p1 = bSize === 2 ? gf1.p2 : gf1.p1;
        gf2.p2 = bSize === 2 ? gf1.p1 : gf1.p2;
        resolveMatch(gf2, matches);
      }
      const lfId = bSize === 4 ? 'L-R1-M0' : bSize === 8 ? 'L-R3-M0' : null;
      let first = null, second = null;
      if (gf1.effectiveWinner === 1) { first = gf1.winnerPlayer; second = gf1.loserPlayer; }
      else if (gf1.effectiveWinner === 2 && gf2.effectiveWinner) { first = gf2.winnerPlayer; second = gf2.loserPlayer; }
      return {
        format: 'double', bSize, isSym: false, matches,
        podium: {
          first, second,
          third: state.podiumCount === 3 && lfId && matches[lfId] ? matches[lfId].loserPlayer : null
        }
      };
    }

    function computeLayout(evalRes) {
      const cards = [], lines = [], headers = [], zones = [], map = {};
      const add = (c) => { cards.push(c); map[c.match.id] = c; };
      const { matches, bSize, isSym, format } = evalRes;

      if (format === 'single') {
        const totalRounds = Math.log2(bSize), topY = 148, areaH = 724;
        if (isSym) {
          const sideRounds = totalRounds - 1, cols = sideRounds * 2 + 1, marginX = 28, gapX = totalRounds === 5 ? 20 : 32;
          const cardW = Math.floor((1600 - marginX * 2 - (cols - 1) * gapX) / cols), cardH = totalRounds === 5 ? 60 : 72;
          const colX = (c) => marginX + c * (cardW + gapX);
          for (let r = 0; r < sideRounds; r++) {
            const hc = (bSize / Math.pow(2, r + 1)) / 2, x = colX(r);
            headers.push({ x, y: 118, w: cardW, label: matches['S-R'+r+'-M0'].roundLabel });
            for (let m = 0; m < hc; m++) {
              const cy = r === 0 ? topY + (m + 0.5) * (areaH / hc) : (map['S-R'+(r-1)+'-M'+(m*2)].cy + map['S-R'+(r-1)+'-M'+(m*2+1)].cy) / 2;
              add({ match: matches['S-R'+r+'-M'+m], x, y: cy - cardH/2, w: cardW, h: cardH, cx: x + cardW/2, cy, dir: 'ltr' });
            }
          }
          for (let r = 0; r < sideRounds; r++) {
            const hc = (bSize / Math.pow(2, r + 1)) / 2, x = colX(cols - 1 - r);
            headers.push({ x, y: 118, w: cardW, label: matches['S-R'+r+'-M'+hc].roundLabel });
            for (let m = 0; m < hc; m++) {
              const cy = r === 0 ? topY + (m + 0.5) * (areaH / hc) : (map['S-R'+(r-1)+'-M'+(hc*2+m*2)].cy + map['S-R'+(r-1)+'-M'+(hc*2+m*2+1)].cy) / 2;
              add({ match: matches['S-R'+r+'-M'+(hc+m)], x, y: cy - cardH/2, w: cardW, h: cardH, cx: x + cardW/2, cy, dir: 'rtl' });
            }
          }
          const finalW = cardW + 12, finalX = colX(sideRounds) - 6, finalH = 76;
          const has3rd = !!matches['S-3RD'], finalCy = has3rd ? topY + areaH * 0.42 : topY + areaH * 0.5;
          headers.push({ x: finalX, y: 118, w: finalW, label: 'GRAND FINAL' });
          add({ match: matches['S-R'+(totalRounds-1)+'-M0'], x: finalX, y: finalCy - finalH/2, w: finalW, h: finalH, cx: finalX + finalW/2, cy: finalCy, dir: 'center' });
          if (has3rd) {
            const thirdCy = topY + areaH * 0.78;
            headers.push({ x: finalX, y: thirdCy - finalH/2 - 24, w: finalW, label: '3RD PLACE MATCH' });
            add({ match: matches['S-3RD'], x: finalX, y: thirdCy - finalH/2, w: finalW, h: finalH, cx: finalX + finalW/2, cy: thirdCy, dir: 'center' });
          }
          for (const c of cards) {
            if (!c.match.nextWinTarget) continue;
            const t = map[c.match.nextWinTarget.matchId];
            if (!t) continue;
            const x1 = c.dir === 'ltr' ? c.x + c.w : c.x, x2 = c.dir === 'ltr' ? t.x : t.x + t.w, mx = (x1 + x2) / 2;
            lines.push({ d: 'M '+x1+' '+c.cy+' H '+mx+' V '+t.cy+' H '+x2, active: !!c.match.winnerPlayer, tone: t.dir === 'center' ? 'gold' : 'cyan' });
          }
        } else {
          const marginX = totalRounds === 1 ? 520 : totalRounds === 2 ? 260 : 100, gapX = totalRounds === 2 ? 180 : 120;
          const cardW = Math.min(340, Math.floor((1600 - marginX*2 - (totalRounds-1)*gapX) / totalRounds)), cardH = totalRounds === 3 ? 78 : 90;
          for (let r = 0; r < totalRounds; r++) {
            const mc = bSize / Math.pow(2, r+1), x = marginX + r*(cardW+gapX);
            headers.push({ x, y: 120, w: cardW, label: matches['S-R'+r+'-M0'].roundLabel });
            for (let m = 0; m < mc; m++) {
              const cy = r === 0 ? topY + (m+0.5)*(areaH/mc) : (map['S-R'+(r-1)+'-M'+(m*2)].cy + map['S-R'+(r-1)+'-M'+(m*2+1)].cy)/2;
              add({ match: matches['S-R'+r+'-M'+m], x, y: cy - cardH/2, w: cardW, h: cardH, cx: x+cardW/2, cy, dir: 'ltr' });
            }
          }
          if (matches['S-3RD']) {
            const fc = map['S-R'+(totalRounds-1)+'-M0'], tCy = Math.min(815, fc.cy + 210);
            headers.push({ x: fc.x, y: tCy - cardH/2 - 24, w: cardW, label: '3RD PLACE MATCH' });
            add({ match: matches['S-3RD'], x: fc.x, y: tCy - cardH/2, w: cardW, h: cardH, cx: fc.x+cardW/2, cy: tCy, dir: 'ltr' });
          }
          for (const c of cards) {
            if (!c.match.nextWinTarget) continue;
            const t = map[c.match.nextWinTarget.matchId];
            const x1 = c.x + c.w, x2 = t.x, mx = (x1 + x2) / 2;
            lines.push({ d: 'M '+x1+' '+c.cy+' H '+mx+' V '+t.cy+' H '+x2, active: !!c.match.winnerPlayer, tone: !t.match.nextWinTarget ? 'gold' : 'cyan' });
          }
        }
        return { cards, lines, headers, zones };
      }

      // Double Elimination Layout
      const conn = (fId, tId, tone, active) => {
        const f = map[fId], t = map[tId]; if (!f || !t) return;
        const x1 = f.x + f.w, x2 = t.x, mx = (x1 + x2) / 2;
        lines.push({ d: 'M '+x1+' '+f.cy+' H '+mx+' V '+t.cy+' H '+x2, active, tone });
      };

      if (bSize === 2) {
        zones.push({ x: 180, y: 180, text: 'WINNERS FINAL', tone: 'cyan' }, { x: 640, y: 180, text: 'GRAND FINAL', tone: 'gold' }, { x: 1080, y: 180, text: 'BRACKET RESET', tone: 'orange' });
        add({ match: matches['W-R0-M0'], x: 180, y: 360, w: 320, h: 92, cx: 340, cy: 406 });
        add({ match: matches['GF-1'], x: 640, y: 360, w: 320, h: 92, cx: 800, cy: 406 });
        add({ match: matches['GF-2'], x: 1080, y: 360, w: 320, h: 92, cx: 1240, cy: 406 });
        conn('W-R0-M0', 'GF-1', 'cyan', !!matches['W-R0-M0'].winnerPlayer);
        conn('GF-1', 'GF-2', 'gold', !matches['GF-2'].isDisabled);
      } else if (bSize === 4) {
        const w = 300, h = 78;
        zones.push({ x: 60, y: 124, text: 'WINNERS BRACKET', tone: 'cyan' }, { x: 60, y: 516, text: 'LOSERS BRACKET', tone: 'orange' }, { x: 960, y: 124, text: 'GRAND FINALS', tone: 'gold' });
        headers.push({ x: 60, y: 148, w, label: 'WINNERS SF' }, { x: 480, y: 148, w, label: 'WINNERS FINAL' }, { x: 60, y: 540, w, label: 'LOSERS R1' }, { x: 480, y: 540, w, label: 'LOSERS FINAL' }, { x: 960, y: 416, w, label: 'GRAND FINAL' }, { x: 1280, y: 416, w: 260, label: 'GF RESET' });
        add({ match: matches['W-R0-M0'], x: 60, y: 196, w, h, cx: 60+w/2, cy: 196+h/2 });
        add({ match: matches['W-R0-M1'], x: 60, y: 344, w, h, cx: 60+w/2, cy: 344+h/2 });
        add({ match: matches['W-R1-M0'], x: 480, y: 270, w, h, cx: 480+w/2, cy: 270+h/2 });
        add({ match: matches['L-R0-M0'], x: 60, y: 650, w, h, cx: 60+w/2, cy: 650+h/2 });
        add({ match: matches['L-R1-M0'], x: 480, y: 650, w, h, cx: 480+w/2, cy: 650+h/2 });
        add({ match: matches['GF-1'], x: 960, y: 444, w, h: h+6, cx: 960+w/2, cy: 444+(h+6)/2 });
        add({ match: matches['GF-2'], x: 1280, y: 444, w: 260, h: h+6, cx: 1410, cy: 444+(h+6)/2 });
        conn('W-R0-M0', 'W-R1-M0', 'cyan', !!matches['W-R0-M0'].winnerPlayer);
        conn('W-R0-M1', 'W-R1-M0', 'cyan', !!matches['W-R0-M1'].winnerPlayer);
        conn('L-R0-M0', 'L-R1-M0', 'orange', !!matches['L-R0-M0'].winnerPlayer);
        conn('W-R1-M0', 'GF-1', 'gold', !!matches['W-R1-M0'].winnerPlayer);
        conn('L-R1-M0', 'GF-1', 'gold', !!matches['L-R1-M0'].winnerPlayer);
        conn('GF-1', 'GF-2', 'gold', !matches['GF-2'].isDisabled);
      } else {
        const w = 248, gx = 54, colX = (c) => 34 + c*(w+gx);
        zones.push({ x: 34, y: 120, text: 'WINNERS BRACKET', tone: 'cyan' }, { x: 34, y: 504, text: 'LOSERS BRACKET', tone: 'orange' }, { x: 1268, y: 120, text: 'GRAND FINALS', tone: 'gold' });
        const wc = [colX(0), (colX(1)+colX(2))/2, colX(3)];
        headers.push({ x: wc[0], y: 142, w, label: 'WINNERS QF' }, { x: wc[1], y: 142, w, label: 'WINNERS SF' }, { x: wc[2], y: 142, w, label: 'WINNERS FINAL' });
        for (let m=0; m<4; m++) { const cy = 166 + (m+0.5)*(314/4); add({ match: matches['W-R0-M'+m], x: wc[0], y: cy-31, w, h: 62, cx: wc[0]+w/2, cy }); }
        for (let m=0; m<2; m++) { const cy = (map['W-R0-M'+(m*2)].cy + map['W-R0-M'+(m*2+1)].cy)/2; add({ match: matches['W-R1-M'+m], x: wc[1], y: cy-31, w, h: 62, cx: wc[1]+w/2, cy }); }
        { const cy = (map['W-R1-M0'].cy + map['W-R1-M1'].cy)/2; add({ match: matches['W-R2-M0'], x: wc[2], y: cy-31, w, h: 62, cx: wc[2]+w/2, cy }); }
        headers.push({ x: colX(0), y: 528, w, label: 'LOSERS R1' }, { x: colX(1), y: 528, w, label: 'LOSERS QF' }, { x: colX(2), y: 528, w, label: 'LOSERS SF' }, { x: colX(3), y: 528, w, label: 'LOSERS FINAL' });
        for (let m=0; m<2; m++) {
          const cy = 556 + (m+0.5)*(310/2);
          add({ match: matches['L-R0-M'+m], x: colX(0), y: cy-34, w, h: 68, cx: colX(0)+w/2, cy });
          add({ match: matches['L-R1-M'+m], x: colX(1), y: cy-34, w, h: 68, cx: colX(1)+w/2, cy });
        }
        { const cy = (map['L-R1-M0'].cy + map['L-R1-M1'].cy)/2; add({ match: matches['L-R2-M0'], x: colX(2), y: cy-34, w, h: 68, cx: colX(2)+w/2, cy }); add({ match: matches['L-R3-M0'], x: colX(3), y: cy-34, w, h: 68, cx: colX(3)+w/2, cy }); }
        headers.push({ x: 1268, y: 403, w: 294, label: 'GRAND FINAL' }, { x: 1268, y: 575, w: 294, label: 'GF RESET (IF LB WINS)' });
        add({ match: matches['GF-1'], x: 1268, y: 427, w: 294, h: 82, cx: 1415, cy: 468 });
        add({ match: matches['GF-2'], x: 1268, y: 599, w: 294, h: 82, cx: 1415, cy: 640 });
        conn('W-R0-M0', 'W-R1-M0', 'cyan', !!matches['W-R0-M0'].winnerPlayer);
        conn('W-R0-M1', 'W-R1-M0', 'cyan', !!matches['W-R0-M1'].winnerPlayer);
        conn('W-R0-M2', 'W-R1-M1', 'cyan', !!matches['W-R0-M2'].winnerPlayer);
        conn('W-R0-M3', 'W-R1-M1', 'cyan', !!matches['W-R0-M3'].winnerPlayer);
        conn('W-R1-M0', 'W-R2-M0', 'cyan', !!matches['W-R1-M0'].winnerPlayer);
        conn('W-R1-M1', 'W-R2-M0', 'cyan', !!matches['W-R1-M1'].winnerPlayer);
        conn('L-R0-M0', 'L-R1-M0', 'orange', !!matches['L-R0-M0'].winnerPlayer);
        conn('L-R0-M1', 'L-R1-M1', 'orange', !!matches['L-R0-M1'].winnerPlayer);
        conn('L-R1-M0', 'L-R2-M0', 'orange', !!matches['L-R1-M0'].winnerPlayer);
        conn('L-R1-M1', 'L-R2-M0', 'orange', !!matches['L-R1-M1'].winnerPlayer);
        conn('L-R2-M0', 'L-R3-M0', 'orange', !!matches['L-R2-M0'].winnerPlayer);
        conn('W-R2-M0', 'GF-1', 'gold', !!matches['W-R2-M0'].winnerPlayer);
        conn('L-R3-M0', 'GF-1', 'gold', !!matches['L-R3-M0'].winnerPlayer);
        lines.push({ d: 'M 1415 509 V 599', active: !matches['GF-2'].isDisabled, tone: 'gold' });
      }
      return { cards, lines, headers, zones };
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function render() {
      const evalRes = evaluateBracket();
      const layout = computeLayout(evalRes);

      document.getElementById('stage-title').textContent = state.title || 'TOURNAMENT CHAMPIONSHIP';
      document.getElementById('stage-meta').innerHTML =
        '<span class="text-cyan-400 font-semibold">' + (state.format === 'single' ? 'SINGLE ELIMINATION' : 'DOUBLE ELIMINATION') + '</span>' +
        '<span>·</span><span class="font-mono-num">' + state.playerCount + ' PLAYERS</span>' +
        '<span>·</span><span class="font-mono-num">TOP ' + state.podiumCount + '</span>' +
        (evalRes.isSym ? '<span>·</span><span>SYMMETRIC BRACKET</span>' : '');

      const podEl = document.getElementById('stage-podium');
      const podItems = [
        { rank: 1, label: '1ST · CHAMPION', p: evalRes.podium.first, border: evalRes.podium.first ? 'border-amber-400/70 bg-amber-500/10' : 'border-slate-800 bg-[#0F131C]/80', text: 'text-amber-400' },
        state.podiumCount >= 2 ? { rank: 2, label: '2ND · RUNNER-UP', p: evalRes.podium.second, border: evalRes.podium.second ? 'border-slate-400/60 bg-slate-400/10' : 'border-slate-800 bg-[#0F131C]/80', text: 'text-slate-300' } : null,
        state.podiumCount >= 3 ? { rank: 3, label: '3RD PLACE', p: evalRes.podium.third, border: evalRes.podium.third ? 'border-[#FF5A1F]/60 bg-[#FF5A1F]/10' : 'border-slate-800 bg-[#0F131C]/80', text: 'text-[#FF8C5A]' } : null
      ].filter(Boolean);

      podEl.innerHTML = podItems.map(item =>
        '<div class="w-[210px] rounded border px-3 py-2 flex flex-col justify-center ' + item.border + '">' +
          '<div class="text-[11px] font-display font-bold tracking-[0.1em] ' + item.text + '">' + item.label + '</div>' +
          '<div class="mt-1 flex items-center gap-2 min-w-0">' +
            (item.p ? '<span class="font-mono-num text-[11px] text-slate-400">#' + String(item.p.seed).padStart(2,'0') + '</span><span class="text-[15px] font-bold text-white truncate">' + esc(item.p.name) + '</span>' : '<span class="text-[13px] text-slate-600">TBD</span>') +
          '</div>' +
        '</div>'
      ).join('');

      document.getElementById('stage-zones').innerHTML = layout.zones.map(z => {
        const col = z.tone === 'cyan' ? 'text-cyan-400' : z.tone === 'orange' ? 'text-[#FF5A1F]' : 'text-amber-400';
        const dot = z.tone === 'cyan' ? 'bg-cyan-400' : z.tone === 'orange' ? 'bg-[#FF5A1F]' : 'bg-amber-400';
        return '<div style="left:'+z.x+'px;top:'+z.y+'px" class="absolute flex items-center gap-2 text-[13px] font-display font-bold tracking-[0.14em] '+col+'"><span class="inline-block w-2 h-2 rotate-45 '+dot+'"></span>'+z.text+'</div>';
      }).join('');

      document.getElementById('stage-headers').innerHTML = layout.headers.map(h =>
        '<div style="left:'+h.x+'px;top:'+h.y+'px;width:'+h.w+'px" class="absolute text-center text-[12px] font-display font-bold tracking-[0.12em] text-slate-400 uppercase">'+h.label+'</div>'
      ).join('');

      document.getElementById('stage-lines').innerHTML = layout.lines.map(l => {
        const sc = l.active ? (l.tone === 'orange' ? '#FF5A1F' : l.tone === 'gold' ? '#F5B82E' : '#00E5FF') : '#253045';
        return '<path d="'+l.d+'" fill="none" stroke="'+sc+'" stroke-width="'+(l.active?2.25:1.5)+'" stroke-opacity="'+(l.active?0.9:0.75)+'" />';
      }).join('');

      document.getElementById('stage-cards').innerHTML = layout.cards.map(c => {
        const m = c.match;
        const isFinal = m.id === 'GF-1' || m.id === 'GF-2' || (m.bracket === 'single' && !m.nextWinTarget);
        const isLosers = m.bracket === 'losers';
        const isThird = m.bracket === 'third';
        const rowH = Math.floor((c.h - 2) / 2);
        const compact = c.h <= 62;
        const can = !m.isDisabled && !m.isAutoBye && !!(m.p1 && m.p2);
        let frame = 'border-slate-800 bg-[#0F141E]/95';
        if (m.isDisabled) frame = 'border-slate-800/50 bg-[#0B0E15]/60 opacity-45';
        else if (isFinal) frame = 'border-amber-500/45 bg-[#121622]';
        else if (isThird) frame = 'border-[#FF5A1F]/40 bg-[#12151F]';
        else if (m.effectiveWinner) frame = isLosers ? 'border-[#FF5A1F]/45 bg-[#111520]' : 'border-cyan-500/40 bg-[#111622]';

        const renderRow = (p, isBye, slot) => {
          const isW = m.effectiveWinner === slot, isL = m.effectiveWinner && m.effectiveWinner !== slot;
          const accentBg = isLosers ? 'bg-[#FF5A1F]/20 text-white' : isFinal ? 'bg-amber-400/20 text-amber-50' : 'bg-cyan-400/15 text-white';
          const accentTx = isLosers ? 'text-[#FF7A48]' : isFinal ? 'text-amber-400' : 'text-cyan-400';
          return '<button type="button" ' + (can ? 'data-match="'+m.id+'" data-slot="'+slot+'"' : 'disabled') +
            ' style="height:'+rowH+'px" class="w-full px-2 flex items-center justify-between gap-1.5 text-left transition-colors ' +
            (isW ? accentBg : isL ? 'text-slate-500' : 'text-slate-200') + (can ? ' cursor-pointer hover:bg-slate-800/70' : ' cursor-default') + '">' +
            '<div class="flex items-center gap-1.5 min-w-0">' +
              (p ? '<span class="font-mono-num '+(compact?'text-[10px]':'text-[11px]')+' '+(isW?accentTx:'text-slate-500')+'">'+String(p.seed).padStart(2,'0')+'</span><span class="truncate '+(compact?'text-[12px]':'text-[13px]')+' '+(isW?'font-bold text-white':isL?'line-through decoration-slate-600':'font-medium')+'">'+esc(p.name)+'</span>'
                 : isBye ? '<span class="text-[11px] font-mono-num text-slate-600 italic">BYE</span>' : '<span class="text-[11px] text-slate-600">—</span>') +
            '</div>' +
            (isW ? '<span class="font-display font-bold '+(compact?'text-[10px]':'text-[11px]')+' '+accentTx+'">WIN</span>' : '') +
          '</button>';
        };

        return '<div style="left:'+c.x+'px;top:'+c.y+'px;width:'+c.w+'px;height:'+c.h+'px" class="absolute rounded border flex flex-col justify-between overflow-hidden '+frame+'">' +
          renderRow(m.p1, m.p1IsBye, 1) +
          '<div class="h-[1px] bg-slate-800/90 w-full"></div>' +
          renderRow(m.p2, m.p2IsBye, 2) +
        '</div>';
      }).join('');
    }

    document.getElementById('stage-cards').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-match]');
      if (!btn) return;
      const id = btn.dataset.match, slot = Number(btn.dataset.slot);
      if (state.results[id] === slot) delete state.results[id];
      else state.results[id] = slot;
      persist();
      render();
    });

    function rescale() {
      const wrap = document.getElementById('stage-wrapper');
      const r = wrap.getBoundingClientRect();
      const s = Math.min(r.width / 1600, r.height / 900);
      document.getElementById('stage-canvas').style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', rescale);
    new ResizeObserver(rescale).observe(document.getElementById('stage-wrapper'));

    // Inline Title Edit
    const titleEl = document.getElementById('stage-title');
    const titleInput = document.getElementById('stage-title-input');
    titleEl.addEventListener('click', () => {
      if (state.broadcastMode) return;
      titleEl.classList.add('hidden');
      titleInput.classList.remove('hidden');
      titleInput.value = state.title;
      titleInput.focus();
    });
    const finishTitle = () => {
      state.title = titleInput.value.trim() || 'TOURNAMENT CHAMPIONSHIP';
      titleInput.classList.add('hidden');
      titleEl.classList.remove('hidden');
      persist(); render();
    };
    titleInput.addEventListener('blur', finishTitle);
    titleInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === 'Escape') finishTitle(); });

    // Broadcast Mode
    const setBroadcast = (on) => {
      state.broadcastMode = on;
      document.getElementById('app-toolbar').classList.toggle('hidden', on);
      document.getElementById('btn-exit-broadcast').classList.toggle('hidden', !on);
      rescale();
    };
    document.getElementById('btn-broadcast').addEventListener('click', () => setBroadcast(true));
    document.getElementById('btn-exit-broadcast').addEventListener('click', () => setBroadcast(false));
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.broadcastMode) setBroadcast(false); });

    // Reset
    document.getElementById('btn-reset-progress').addEventListener('click', () => {
      state.results = {};
      persist(); render();
    });

    // Settings Modal
    let draftFmt = state.format, draftPod = state.podiumCount;
    const syncSettingsModal = () => {
      const max = draftFmt === 'double' ? 8 : 32;
      document.getElementById('set-max-label').textContent = max;
      document.querySelectorAll('.fmt-btn').forEach(b => {
        const active = b.dataset.fmt === draftFmt;
        b.className = 'fmt-btn rounded border px-3 py-2.5 text-left cursor-pointer ' + (active ? (draftFmt==='double'?'border-[#FF5A1F] bg-[#FF5A1F]/15 text-white':'border-cyan-400 bg-cyan-500/15 text-white') : 'border-slate-800 bg-[#080A0F] text-slate-400');
      });
      document.querySelectorAll('.pod-btn').forEach(b => {
        const active = Number(b.dataset.podium) === draftPod;
        b.className = 'pod-btn rounded border px-3 py-2 text-xs font-semibold cursor-pointer ' + (active ? 'border-amber-400 bg-amber-500/15 text-amber-200' : 'border-slate-800 bg-[#080A0F] text-slate-400');
      });
      const presets = draftFmt === 'double' ? [4, 6, 8] : [4, 8, 16, 24, 32];
      const cur = parseInt(document.getElementById('set-count').value, 10);
      document.getElementById('set-presets').innerHTML = presets.map(p =>
        '<button type="button" data-preset="'+p+'" class="px-2.5 py-1.5 rounded text-xs font-mono-num font-semibold border cursor-pointer '+(cur===p?'border-cyan-400 bg-cyan-500/15 text-cyan-200':'border-slate-800 bg-[#080A0F] text-slate-400')+'">'+p+'名</button>'
      ).join('');
      const err = document.getElementById('set-error'), save = document.getElementById('btn-save-settings');
      if (isNaN(cur) || cur < 2) { err.textContent = '参加者数は2名以上で入力してください。'; err.classList.remove('hidden'); save.disabled = true; }
      else if (cur > max) { err.textContent = draftFmt === 'double' ? 'ダブルエリミネーションの参加者は最大8名までです。' : 'シングルエリミネーションの参加者は最大32名までです。'; err.classList.remove('hidden'); save.disabled = true; }
      else { err.classList.add('hidden'); save.disabled = false; }
    };
    document.getElementById('btn-open-settings').addEventListener('click', () => {
      draftFmt = state.format; draftPod = state.podiumCount;
      document.getElementById('set-title').value = state.title;
      document.getElementById('set-count').value = state.playerCount;
      syncSettingsModal();
      document.getElementById('modal-settings').classList.remove('hidden');
    });
    document.querySelectorAll('.fmt-btn').forEach(b => b.addEventListener('click', () => { draftFmt = b.dataset.fmt; syncSettingsModal(); }));
    document.querySelectorAll('.pod-btn').forEach(b => b.addEventListener('click', () => { draftPod = Number(b.dataset.podium); syncSettingsModal(); }));
    document.getElementById('set-count').addEventListener('input', syncSettingsModal);
    document.getElementById('set-presets').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-preset]');
      if (btn) { document.getElementById('set-count').value = btn.dataset.preset; syncSettingsModal(); }
    });
    document.getElementById('form-settings').addEventListener('submit', (e) => {
      e.preventDefault();
      const cnt = parseInt(document.getElementById('set-count').value, 10);
      const max = draftFmt === 'double' ? 8 : 32;
      if (isNaN(cnt) || cnt < 2 || cnt > max) return;
      state.title = document.getElementById('set-title').value.trim() || 'TOURNAMENT CHAMPIONSHIP';
      const changedStruct = state.format !== draftFmt || state.playerCount !== cnt;
      state.format = draftFmt;
      state.playerCount = cnt;
      state.podiumCount = draftPod;
      while (state.players.length < cnt) state.players.push('Player ' + (state.players.length + 1));
      if (changedStruct) state.results = {};
      document.getElementById('modal-settings').classList.add('hidden');
      persist(); render();
    });

    // Bulk Players Modal
    let pMode = 'list', pDraft = [];
    const renderPlayersModal = () => {
      const body = document.getElementById('players-body');
      document.getElementById('tab-list').className = 'px-3 py-1 rounded text-xs font-semibold cursor-pointer ' + (pMode==='list'?'bg-slate-700 text-white':'text-slate-400');
      document.getElementById('tab-text').className = 'px-3 py-1 rounded text-xs font-semibold cursor-pointer ' + (pMode==='text'?'bg-slate-700 text-white':'text-slate-400');
      if (pMode === 'list') {
        body.innerHTML = '<div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">' +
          pDraft.map((n, i) => '<div class="flex items-center gap-2 rounded border border-slate-800 bg-[#080A0F] px-2.5 py-1.5"><span class="font-mono-num text-xs text-slate-500 w-7">#'+String(i+1).padStart(2,'0')+'</span><input data-pidx="'+i+'" value="'+esc(n)+'" class="w-full bg-transparent text-sm text-white focus:outline-none" /></div>').join('') +
        '</div>';
        body.querySelectorAll('input[data-pidx]').forEach(inp => inp.addEventListener('input', () => { pDraft[Number(inp.dataset.pidx)] = inp.value; }));
      } else {
        body.innerHTML = '<textarea id="players-textarea" rows="12" class="w-full rounded border border-slate-700 bg-[#080A0F] p-3 text-sm font-mono-num text-white focus:border-cyan-400 focus:outline-none">'+esc(pDraft.join('\n'))+'</textarea>';
      }
    };
    document.getElementById('btn-open-players').addEventListener('click', () => {
      pMode = 'list';
      pDraft = Array.from({ length: state.playerCount }, (_, i) => state.players[i] || ('Player ' + (i + 1)));
      renderPlayersModal();
      document.getElementById('modal-players').classList.remove('hidden');
    });
    document.getElementById('tab-list').addEventListener('click', () => {
      if (pMode === 'text') {
        const lines = document.getElementById('players-textarea').value.split(/\r?\n/);
        pDraft = pDraft.map((v, i) => (lines[i] !== undefined ? lines[i] : v));
      }
      pMode = 'list'; renderPlayersModal();
    });
    document.getElementById('tab-text').addEventListener('click', () => { pMode = 'text'; renderPlayersModal(); });
    document.getElementById('btn-shuffle-players').addEventListener('click', () => {
      if (pMode === 'text') {
        const lines = document.getElementById('players-textarea').value.split(/\r?\n/);
        pDraft = pDraft.map((v, i) => (lines[i] !== undefined ? lines[i].trim() || v : v));
      }
      for (let i = pDraft.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pDraft[i], pDraft[j]] = [pDraft[j], pDraft[i]]; }
      renderPlayersModal();
    });
    document.getElementById('btn-save-players').addEventListener('click', () => {
      if (pMode === 'text') {
        const lines = document.getElementById('players-textarea').value.split(/\r?\n/);
        pDraft = pDraft.map((_, i) => (lines[i] || '').trim() || ('Player ' + (i + 1)));
      } else {
        pDraft = pDraft.map((n, i) => n.trim() || ('Player ' + (i + 1)));
      }
      for (let i = 0; i < state.playerCount; i++) state.players[i] = pDraft[i];
      document.getElementById('modal-players').classList.add('hidden');
      persist(); render();
    });

    document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.close).classList.add('hidden')));

    // Inline PWA Manifest & Service Worker Setup
    (function initPWA() {
      try {
        function makePngIcon(size) {
          const c = document.createElement('canvas'); c.width = size; c.height = size;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#080A0F'; ctx.fillRect(0, 0, size, size);
          ctx.strokeStyle = '#00E5FF'; ctx.lineWidth = Math.max(3, size * 0.05);
          const s = size;
          ctx.beginPath();
          ctx.moveTo(s*0.2, s*0.28); ctx.lineTo(s*0.42, s*0.28); ctx.lineTo(s*0.42, s*0.42); ctx.lineTo(s*0.2, s*0.42);
          ctx.moveTo(s*0.2, s*0.58); ctx.lineTo(s*0.42, s*0.58); ctx.lineTo(s*0.42, s*0.72); ctx.lineTo(s*0.2, s*0.72);
          ctx.moveTo(s*0.42, s*0.35); ctx.lineTo(s*0.58, s*0.35); ctx.lineTo(s*0.58, s*0.65); ctx.lineTo(s*0.42, s*0.65);
          ctx.stroke();
          ctx.strokeStyle = '#FF5A1F'; ctx.beginPath(); ctx.moveTo(s*0.58, s*0.5); ctx.lineTo(s*0.72, s*0.5); ctx.stroke();
          ctx.fillStyle = '#F5B82E'; ctx.beginPath(); ctx.moveTo(s*0.74, s*0.4); ctx.lineTo(s*0.88, s*0.5); ctx.lineTo(s*0.74, s*0.6); ctx.closePath(); ctx.fill();
          return c.toDataURL('image/png');
        }
        const icon192 = makePngIcon(192), icon512 = makePngIcon(512);
        document.getElementById('pwa-apple-icon').href = icon192;
        const manifest = {
          id: './', name: 'APEX BRACKET — Tournament Studio', short_name: 'APEX BRACKET',
          start_url: './', display: 'standalone', background_color: '#080A0F', theme_color: '#080A0F',
          icons: [{ src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' }]
        };
        document.getElementById('pwa-manifest').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
          const swCode = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',()=>{});";
          const swUrl = URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }));
          navigator.serviceWorker.register(swUrl).catch(() => {});
        }
        let deferredPrompt = window.__deferredPWAPrompt || null;
        const installBtn = document.getElementById('btn-pwa-install');
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (isStandalone) installBtn.classList.add('hidden');
        if (deferredPrompt) installBtn.textContent = 'ワンタッチでアプリ化';
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault(); deferredPrompt = e; window.__deferredPWAPrompt = e;
          installBtn.textContent = 'ワンタッチでアプリ化';
        });
        window.addEventListener('appinstalled', () => {
          deferredPrompt = null; window.__deferredPWAPrompt = null; installBtn.classList.add('hidden');
        });
        installBtn.addEventListener('click', async () => {
          const evt = deferredPrompt || window.__deferredPWAPrompt;
          if (evt) {
            evt.prompt();
            const res = await evt.userChoice;
            if (res && res.outcome === 'accepted') {
              deferredPrompt = null; window.__deferredPWAPrompt = null;
              installBtn.classList.add('hidden');
              return;
            }
          }
          const msg = document.getElementById('pwa-guide-msg');
          const openTab = document.getElementById('pwa-open-tab');
          openTab.classList.add('hidden');
          if (location.protocol === 'file:') {
            msg.textContent = '現在ローカルファイル（file://）として開かれています。ブラウザの仕様上、ワンタッチPWAインストールにはHTTPSまたはlocalhost環境での配信が必要です。';
          } else if (window.self !== window.top) {
            msg.textContent = 'ブラウザのセキュリティ仕様により、iframeプレビュー内ではインストールダイアログがブロックされます。下のボタンで専用タブを開くとワンタッチでインストールできます。';
            openTab.href = location.href;
            openTab.classList.remove('hidden');
          } else {
            msg.textContent = 'お使いのブラウザのメニューまたはアドレスバーから「アプリをインストール / ホーム画面に追加」を選択できます。';
          }
          document.getElementById('modal-pwa').classList.remove('hidden');
        });
      } catch (_) {}
    })();

    render();
    rescale();
  </script>
</body>
</html>
