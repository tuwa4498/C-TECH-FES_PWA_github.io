<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GAME EVENT COUNTDOWN // PWA</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Orbitron (デジタル数字), Noto Sans JP, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Noto+Sans+JP:wght@500;700;900&family=Orbitron:wght@600;800;900&display=swap"
        rel="stylesheet">

    <!-- インライン PWA Manifest (Data URI) -->
    <link rel="manifest" id="pwa-manifest" href="" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans JP"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                        display: ['"Orbitron"', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            bg: '#070a12',
                            panel: '#0f1626',
                            border: '#1e293b',
                            cyan: '#00f0ff',
                            pink: '#ff0055',
                            amber: '#ffaa00',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* カスタムスタイル & サイバー演出 */
        :root {
            --glow-color: rgba(0, 240, 255, 0.55);
            --accent-color: #00f0ff;
        }

        body {
            background-color: #070a12;
            color: #f8fafc;
            overflow-x: hidden;
            user-select: none;
        }

        /* 背景のサイバーグリッド */
        .cyber-grid {
            background-size: 48px 48px;
            background-image:
                linear-gradient(to right, rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
        }

        /* スキャンライン効果 */
        .scanlines {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%,
                    rgba(0, 0, 0, 0.28) 50%);
            background-size: 100% 4px;
        }

        /* ネオンテキスト発光 */
        .neon-text {
            text-shadow:
                0 0 12px var(--glow-color),
                0 0 32px var(--glow-color),
                0 0 64px rgba(0, 240, 255, 0.25);
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        .neon-text-warn {
            --glow-color: rgba(255, 170, 0, 0.65);
            color: #ffbe3b !important;
            text-shadow:
                0 0 15px rgba(255, 170, 0, 0.7),
                0 0 40px rgba(255, 130, 0, 0.45);
        }

        .neon-text-danger {
            --glow-color: rgba(255, 0, 85, 0.75);
            color: #ff2a6d !important;
            text-shadow:
                0 0 18px rgba(255, 0, 85, 0.85),
                0 0 48px rgba(255, 0, 85, 0.55);
        }

        /* 0になった時のインパクト振動・フラッシュアニメーション */
        @keyframes impactShake {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            10% {
                transform: translate(-8px, 6px) scale(1.04);
            }

            20% {
                transform: translate(8px, -6px) scale(1.03);
            }

            30% {
                transform: translate(-6px, -4px) scale(1.02);
            }

            40% {
                transform: translate(6px, 4px) scale(1.01);
            }

            50% {
                transform: translate(-3px, 2px) scale(1);
            }
        }

        @keyframes screenFlash {
            0% {
                opacity: 0.9;
                background-color: #ffffff;
            }

            15% {
                opacity: 0.6;
                background-color: #00f0ff;
            }

            100% {
                opacity: 0;
                background-color: transparent;
            }
        }

        .animate-impact {
            animation: impactShake 0.65s cubic-bezier(.36, .07, .19, .97) both;
        }

        .animate-flash {
            animation: screenFlash 0.85s ease-out forwards;
        }

        /* 等幅数字（ガタつき防止） */
        .tabular-nums-strict {
            font-variant-numeric: tabular-nums;
        }

        /* スクロールバー装飾 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #070a12;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 9999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>

<body class="cyber-grid min-h-screen flex flex-col relative selection:bg-cyan-500 selection:text-slate-950">

    <!-- インパクト時の画面フラッシュレイヤー -->
    <div id="flash-overlay" class="pointer-events-none fixed inset-0 z-50 opacity-0"></div>

    <!-- 画面右上のトースト通知（alert代替） -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- =====================================================================
       【1】みんなに見せる画面 / プレビューモード共通のステージ表示エリア
       ===================================================================== -->
    <main id="stage-view"
        class="relative flex-1 flex flex-col items-center justify-center p-4 sm:p-8 transition-all duration-300">
        <!-- 背景の装飾リング・グロー -->
        <div class="pointer-events-none absolute inset-0 overflow-hidden flex items-center justify-center">
            <div id="ambient-glow"
                class="w-[65vw] h-[65vw] max-w-[820px] max-h-[820px] rounded-full bg-cyan-500/10 blur-[110px] transition-colors duration-700">
            </div>
        </div>
        <div class="pointer-events-none fixed inset-0 scanlines opacity-40"></div>

        <!-- コーナー装飾（eスポーツHUD風） -->
        <div
            class="pointer-events-none absolute top-4 left-4 w-8 h-8 border-t-2 border-l-2 border-cyan-400/50 rounded-tl-lg">
        </div>
        <div
            class="pointer-events-none absolute top-4 right-4 w-8 h-8 border-t-2 border-r-2 border-cyan-400/50 rounded-tr-lg">
        </div>
        <div
            class="pointer-events-none absolute bottom-4 left-4 w-8 h-8 border-b-2 border-l-2 border-cyan-400/50 rounded-bl-lg">
        </div>
        <div
            class="pointer-events-none absolute bottom-4 right-4 w-8 h-8 border-b-2 border-r-2 border-cyan-400/50 rounded-br-lg">
        </div>

        <!-- プレビューモード中の控えめな復帰ヒント（マウス操作時や数秒後に薄くなる） -->
        <div id="preview-exit-hint"
            class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-40 items-center gap-3 px-4 py-2 rounded-full bg-slate-900/85 border border-cyan-500/40 backdrop-blur-md text-xs sm:text-sm text-slate-200 shadow-lg transition-opacity duration-500">
            <span class="inline-block w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
            <span>プレビュー表示中 — <kbd
                    class="px-1.5 py-0.5 bg-slate-800 border border-slate-600 rounded text-cyan-300 font-mono">Esc</kbd>
                または <kbd
                    class="px-1.5 py-0.5 bg-slate-800 border border-slate-600 rounded text-cyan-300 font-mono">H</kbd>
                で管理者画面に戻る</span>
            <button onclick="exitPreviewMode()"
                class="ml-1 px-2.5 py-1 rounded-full bg-cyan-500/20 hover:bg-cyan-500/40 text-cyan-300 font-bold transition cursor-pointer">
                戻る
            </button>
        </div>

        <!-- オーディエンス画面専用の音声有効化バナー（未クリック時のみ表示） -->
        <div id="audience-audio-banner" class="hidden fixed bottom-5 right-5 z-40">
            <button onclick="unlockAudio(true)"
                class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-900/90 hover:bg-slate-800 border border-cyan-500/50 text-cyan-300 text-xs sm:text-sm font-bold shadow-lg backdrop-blur transition cursor-pointer">
                <svg class="w-4 h-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z">
                    </path>
                </svg>
                <span>クリックして会場サウンドを有効化</span>
            </button>
        </div>

        <!-- ステージ中央コンテンツ -->
        <div id="stage-content"
            class="relative z-10 w-full max-w-6xl flex flex-col items-center text-center my-auto py-4">

            <!-- イベントタイトル / ステータスバッジ -->
            <div class="mb-3 sm:mb-5 flex flex-wrap items-center justify-center gap-2 sm:gap-3">
                <span id="stage-badge"
                    class="px-3 py-1 rounded-full text-xs sm:text-sm font-display font-bold tracking-widest uppercase bg-cyan-500/15 text-cyan-300 border border-cyan-400/40 shadow-[0_0_15px_rgba(0,240,255,0.2)]">
                    STANDBY
                </span>
                <span id="stage-target-info"
                    class="hidden px-3 py-1 rounded-full text-xs sm:text-sm font-mono font-bold bg-slate-800/80 text-slate-300 border border-slate-700">
                    TARGET 14:30
                </span>
            </div>

            <!-- サブタイトル（試合開始まで / 休憩時間 など） -->
            <h1 id="stage-subtitle"
                class="text-2xl sm:text-4xl md:text-5xl font-black tracking-wider text-white mb-2 sm:mb-4 drop-shadow-md">
                NEXT MATCH STARTING IN
            </h1>

            <!-- 巨大デジタルカウントダウン表示 -->
            <div id="timer-wrapper" class="relative my-1 sm:my-3 flex items-center justify-center">
                <div id="timer-display"
                    class="font-display font-black tracking-tight text-cyan-400 neon-text tabular-nums-strict leading-none select-none"
                    style="font-size: clamp(4.2rem, 17vw, 14.5rem);">
                    05:00
                </div>
            </div>

            <!-- 0になった時のメインメッセージ（通常は非表示） -->
            <div id="zero-message-box" class="hidden mt-2 sm:mt-4">
                <div id="zero-message-text"
                    class="inline-block px-6 py-2 sm:px-10 sm:py-3 rounded-2xl bg-pink-600/25 border-2 border-pink-500 text-pink-300 font-display font-black text-2xl sm:text-5xl tracking-widest uppercase shadow-[0_0_30px_rgba(255,0,85,0.5)] animate-pulse">
                    TIME UP / START!
                </div>
            </div>

            <!-- プログレスバー -->
            <div class="w-full max-w-3xl mt-4 sm:mt-8 px-4">
                <div
                    class="h-2 sm:h-3 w-full bg-slate-900/90 rounded-full overflow-hidden border border-slate-800 p-0.5">
                    <div id="stage-progress-bar"
                        class="h-full w-full bg-gradient-to-r from-cyan-400 via-blue-500 to-cyan-300 rounded-full transition-all duration-200 shadow-[0_0_12px_rgba(0,240,255,0.6)]">
                    </div>
                </div>
            </div>

            <!-- 下部サブ情報：現在時刻 & 予定時刻 -->
            <div
                class="mt-5 sm:mt-8 flex flex-wrap items-center justify-center gap-4 sm:gap-8 text-slate-400 font-mono text-xs sm:text-base">
                <div
                    class="flex items-center gap-2 bg-slate-900/60 px-3.5 py-1.5 rounded-xl border border-slate-800/80">
                    <span class="text-slate-500">CURRENT TIME</span>
                    <span id="stage-clock"
                        class="text-slate-200 font-bold text-sm sm:text-lg tabular-nums-strict">00:00:00</span>
                </div>
                <div id="stage-end-clock-wrap"
                    class="flex items-center gap-2 bg-slate-900/60 px-3.5 py-1.5 rounded-xl border border-slate-800/80">
                    <span class="text-slate-500">ZERO AT</span>
                    <span id="stage-end-clock"
                        class="text-cyan-300 font-bold text-sm sm:text-lg tabular-nums-strict">--:--:--</span>
                </div>
            </div>
        </div>
    </main>

    <!-- =====================================================================
       【2】管理者コントロールパネル（プレビューモード時・観客画面モード時は非表示）
       ===================================================================== -->
    <section id="admin-panel"
        class="relative z-20 bg-slate-950/95 border-t border-cyan-500/30 backdrop-blur-xl shadow-[0_-10px_40px_rgba(0,0,0,0.75)]">
        <div class="max-w-7xl mx-auto p-3 sm:p-5">

            <!-- ヘッダーバー：モード表示 & 画面切替ボタン -->
            <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-4 border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <div
                        class="w-9 h-9 rounded-xl bg-cyan-500/15 border border-cyan-400/40 flex items-center justify-center text-cyan-400 font-display font-black">
                        GM
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 class="font-bold text-sm sm:text-base text-white">イベントタイマー管理者コンソール</h2>
                            <span id="sync-status-badge"
                                class="px-2 py-0.5 text-[11px] font-mono rounded bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                                SYNC READY
                            </span>
                        </div>
                        <p class="text-xs text-slate-400">現在時刻: <span id="admin-clock"
                                class="font-mono text-cyan-300 font-bold">00:00:00</span></p>
                    </div>
                </div>

                <!-- 画面切替・PWA・プレビューアクションボタン群 -->
                <div class="flex flex-wrap items-center gap-2">
                    <!-- PWAインストールボタン（対応環境で表示） -->
                    <button id="btn-install-pwa" onclick="installPWA()"
                        class="hidden items-center gap-1.5 px-3 py-2 rounded-xl bg-indigo-600/25 hover:bg-indigo-600/40 border border-indigo-500/50 text-indigo-200 text-xs sm:text-sm font-bold transition cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        <span>アプリ化(PWA)</span>
                    </button>

                    <!-- サウンドテストボタン -->
                    <button onclick="testKickImpact()"
                        class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-pink-600/20 hover:bg-pink-600/35 border border-pink-500/50 text-pink-300 text-xs sm:text-sm font-bold transition active:scale-95 cursor-pointer"
                        title="0になった時のどぅーん！という重低音を確認">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z">
                            </path>
                        </svg>
                        <span>どぅーん音テスト</span>
                    </button>

                    <!-- みんなに見せる画面を別ウィンドウ/タブで開く -->
                    <button onclick="openAudienceWindow()"
                        class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-100 text-xs sm:text-sm font-bold transition active:scale-95 cursor-pointer">
                        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                        </svg>
                        <span>みんなに見せる画面を別窓で開く</span>
                    </button>

                    <!-- この画面をそのままプレビュー表示（Esc / H で戻る） -->
                    <button onclick="enterPreviewMode()"
                        class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black text-xs sm:text-sm shadow-[0_0_20px_rgba(0,240,255,0.4)] transition active:scale-95 cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                            </path>
                        </svg>
                        <span>プレビュー全画面 (Esc/Hで戻る)</span>
                    </button>
                </div>
            </div>

            <!-- メイン操作グリッド（3カラム） -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">

                <!-- カラム1：タイマーモード選択 & 時間設定 (5カラム) -->
                <div
                    class="lg:col-span-5 bg-slate-900/80 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
                    <div>
                        <!-- モード切替タブ -->
                        <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-950 rounded-xl border border-slate-800 mb-4">
                            <button id="tab-duration" onclick="switchTimerMode('duration')"
                                class="py-2 px-3 rounded-lg text-xs sm:text-sm font-bold transition bg-cyan-500 text-slate-950 shadow cursor-pointer">
                                ⏱ 指定時間でカウント
                            </button>
                            <button id="tab-target" onclick="switchTimerMode('target')"
                                class="py-2 px-3 rounded-lg text-xs sm:text-sm font-bold transition text-slate-400 hover:text-white cursor-pointer">
                                🕒 指定時刻に0にする
                            </button>
                        </div>

                        <!-- 【モードA】指定時間カウントダウン設定 -->
                        <div id="panel-duration" class="space-y-3">
                            <div class="flex items-center gap-2">
                                <div class="flex-1">
                                    <label class="block text-[11px] text-slate-400 mb-1 font-bold">分 (MIN)</label>
                                    <input id="input-minutes" type="number" min="0" max="999" value="5"
                                        class="w-full bg-slate-950 border border-slate-700 focus:border-cyan-400 rounded-xl px-3 py-2 text-center font-mono text-lg font-bold text-white outline-none" />
                                </div>
                                <span class="text-xl font-bold text-slate-500 pt-5">:</span>
                                <div class="flex-1">
                                    <label class="block text-[11px] text-slate-400 mb-1 font-bold">秒 (SEC)</label>
                                    <input id="input-seconds" type="number" min="0" max="59" value="0"
                                        class="w-full bg-slate-950 border border-slate-700 focus:border-cyan-400 rounded-xl px-3 py-2 text-center font-mono text-lg font-bold text-white outline-none" />
                                </div>
                                <div class="pt-5">
                                    <button onclick="applyDurationInput()"
                                        class="px-4 py-2.5 rounded-xl bg-cyan-500/20 hover:bg-cyan-500/30 border border-cyan-500/50 text-cyan-300 font-bold text-sm transition cursor-pointer">
                                        セット
                                    </button>
                                </div>
                            </div>

                            <!-- クイックプリセットボタン -->
                            <div>
                                <span class="block text-[11px] text-slate-400 mb-1.5 font-bold">クイックプリセット</span>
                                <div class="grid grid-cols-6 gap-1.5">
                                    <button onclick="setPresetDuration(0, 10)"
                                        class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono font-bold text-pink-300 border border-slate-700 transition cursor-pointer">10秒</button>
                                    <button onclick="setPresetDuration(1, 0)"
                                        class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono font-bold text-slate-200 border border-slate-700 transition cursor-pointer">1分</button>
                                    <button onclick="setPresetDuration(3, 0)"
                                        class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono font-bold text-slate-200 border border-slate-700 transition cursor-pointer">3分</button>
                                    <button onclick="setPresetDuration(5, 0)"
                                        class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono font-bold text-cyan-300 border border-cyan-500/40 transition cursor-pointer">5分</button>
                                    <button onclick="setPresetDuration(10, 0)"
                                        class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono font-bold text-slate-200 border border-slate-700 transition cursor-pointer">10分</button>
                                    <button onclick="setPresetDuration(15, 0)"
                                        class="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono font-bold text-slate-200 border border-slate-700 transition cursor-pointer">15分</button>
                                </div>
                            </div>
                        </div>

                        <!-- 【モードB】指定時刻カウントダウン設定 -->
                        <div id="panel-target" class="hidden space-y-3">
                            <div class="flex items-end gap-2">
                                <div class="flex-1">
                                    <label class="block text-[11px] text-slate-400 mb-1 font-bold">0にする目標時刻
                                        (何時何分)</label>
                                    <input id="input-target-time" type="time" step="60"
                                        class="w-full bg-slate-950 border border-slate-700 focus:border-cyan-400 rounded-xl px-3 py-2 font-mono text-lg font-bold text-white outline-none" />
                                </div>
                                <button onclick="startTargetTimeCountdown()"
                                    class="px-4 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-sm transition shadow-[0_0_15px_rgba(0,240,255,0.3)] cursor-pointer">
                                    この時刻で開始
                                </button>
                            </div>
                            <!-- 次のキリの良い時刻クイックボタン -->
                            <div>
                                <span class="block text-[11px] text-slate-400 mb-1.5 font-bold">現在時刻から自動セット</span>

                        <div class="flex flex-wrap gap-1.5">
                            <button onclick="applyTextTemplate('MATCH START', '試合開始までカウントダウン', 'GAME START!')"
                                class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 border border-slate-700 transition cursor-pointer">試合開始</button>

                <!-- カラム3：サウンド & 演出オプション (3カラム) -->
                <div

                            <div>

                                <div class="text-[10px] text-slate-400">直前の電子ビープ音</div>

                                class="w-4 h-4 accent-cyan-400 rounded cursor-pointer" />

                        <!-- 画面フラッシュ＆シェイク演出 + 別窓サウンド切替 -->
                        <div class="grid grid-cols-2 gap-1.5">
                            <label
                                class="flex items-center justify-between p-2 rounded-xl bg-slate-950/80 border border-slate-800 cursor-pointer hover:border-slate-700"
                                title="0秒到達時のフラッシュ＆振動演出">

                                <input id="chk-visual-impact" type="checkbox" checked onchange="syncSettings()"
                                    class="w-3.5 h-3.5 accent-cyan-400 rounded cursor-pointer" />

                            <label
                                class="flex items-center justify-between p-2 rounded-xl bg-slate-950/80 border border-slate-800 cursor-pointer hover:border-slate-700"
                                title="別窓で開いた投影側画面からも音を鳴らす（二重鳴り防止のため初期OFF）">
                                <span class="text-[11px] font-bold text-white">別窓も発音</span>

                                    class="w-3.5 h-3.5 accent-cyan-400 rounded cursor-pointer" />

                    </div>

                    <div
                        class="text-[11px] text-slate-400 bg-slate-950/60 px-3 py-1.5 rounded-xl border border-slate-800/80 leading-relaxed">
                        💡 <strong class="text-slate-200">プレビュー:</strong> <kbd class="text-cyan-300 font-mono">Esc</kbd>
                        か <kbd class="text-cyan-300 font-mono">H</kbd> で復帰します。
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script>
            /**
             * =========================================================================
             * 1. PWA Manifest & Service Worker (単一HTML完結型)
             * =========================================================================
             */
            (function setupPWA() {
                try {
                    // インラインSVGアイコン（ネオンタイマーロゴ）
                    const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="110" fill="#070a12"/>
          <circle cx="256" cy="256" r="190" fill="none" stroke="#00f0ff" stroke-width="24"/>
          <path d="M256 120v140l95 55" fill="none" stroke="#ff0055" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`;
                    const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgIcon);

                    const manifest = {
                        name: 'Game Event Countdown Timer',
                        short_name: 'EventTimer',
                        description: '学校ゲームイベント用プロジェクター連携カウントダウンPWA',
                        start_url: location.href.split('?')[0],
                        display: 'standalone',
                        background_color: '#070a12',
                        theme_color: '#070a12',
                        icons: [
                            { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
                            { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
                        ]
                    };

                    const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
                    const manifestURL = URL.createObjectURL(manifestBlob);
                    document.getElementById('pwa-manifest').setAttribute('href', manifestURL);

                    // Service Worker 登録（Blob URLまたはインライン）
                    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
                        const swCode = `
            const CACHE_NAME = 'event-timer-v1';
            self.addEventListener('install', (e) => {
              self.skipWaiting();
            });
            self.addEventListener('activate', (e) => {
              e.waitUntil(clients.claim());
            });
            self.addEventListener('fetch', (e) => {
              e.respondWith(
                fetch(e.request).catch(() => caches.match(e.request))
              );
            });
          `;
                        const swBlob = new Blob([swCode], { type: 'application/javascript' });
                        const swUrl = URL.createObjectURL(swBlob);
                        navigator.serviceWorker.register(swUrl).catch(() => { });
                    }
                } catch (err) {
                    console.warn('PWA setup skipped:', err);
                }
            })();

        // PWAインストールプロンプト制御
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('btn-install-pwa');
            if (btn) {
                btn.classList.remove('hidden');
                btn.classList.add('flex');
            }
        });

        async function installPWA() {
            if (!deferredPrompt) {
                showToast('ブラウザのメニューから「ホーム画面に追加」または「アプリをインストール」を選択できます', 'info');
                return;
            }
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                showToast('アプリをインストールしました！', 'success');
            }
            deferredPrompt = null;
        }

        /**
         * =========================================================================
         * 2. Web Audio API シンセサイザー（重厚なキックインパクト「どぅーん！」）
         * =========================================================================
         */
        let audioCtx = null;

        function unlockAudio(showFeedback = false) {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                // 観客画面の音声バナーを隠す
                const banner = document.getElementById('audience-audio-banner');
                if (banner) banner.classList.add('hidden');

                if (showFeedback) {
                    showToast('会場サウンド出力を有効化しました', 'success');
                }
            } catch (e) {
                console.warn('AudioContext error:', e);
            }
        }

        // 初回クリック・キー入力時に自動でAudioContextを解除
        ['pointerdown', 'keydown'].forEach(evt => {
            window.addEventListener(evt, () => unlockAudio(false), { once: true });
        });

        // 現在の画面で音を鳴らすべきか判定（二重鳴り防止）
        function canPlayAudioOnThisView() {
            if (state.isMuted || state.volume <= 0) return false;
            if (isAudienceView && !state.audienceSound) return false;
            return true;
        }

        // ソフトクリッピング・サチュレーションカーブ生成（音割れを防ぎつつ音圧・聴こえやすさを大幅向上）
        function createSaturationCurve(amount = 35) {
            const nSamples = 44100;
            const curve = new Float32Array(nSamples);
            const deg = Math.PI / 180;
            for (let i = 0; i < nSamples; ++i) {
                const x = (i * 2) / nSamples - 1;
                curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
            }
            return curve;
        }

        /**
         * 残り3・2・1秒の予告ビープ音
         */
        function playCountdownBeep(secondsLeft) {
            if (!state.tickSound || !canPlayAudioOnThisView()) return;
            unlockAudio(false);
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const masterGain = audioCtx.createGain();
            const vol = (state.volume / 100);
            masterGain.gain.setValueAtTime(vol * 0.65, now);
            masterGain.connect(audioCtx.destination);

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'triangle';
            // 3, 2, 1秒で少しピッチを上げる緊張感演出
            const freq = secondsLeft === 1 ? 1046.5 : 880;
            osc.frequency.setValueAtTime(freq, now);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.98, now + 0.14);

            gain.gain.setValueAtTime(0.001, now);
            gain.gain.linearRampToValueAtTime(0.7, now + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.17);

            osc.connect(gain);
            gain.connect(masterGain);

            osc.start(now);
            osc.stop(now + 0.18);
        }

        /**
         * 0秒になった瞬間の超重厚「キックインパクト（どぅーん！）」合成音
         * - サチュレーター＋ハードリミッターによる高音圧マキシマイズ
         * - アタックの打撃キック（220Hz -> 36Hz急降下）＋ クリックアタック
         * - 地響きのようなサブベース＆倍音ブースト余韻（82Hz -> 24Hzロングディケイ）
         * - シネマティック衝撃ノイズバースト
         */
        function playKickImpact(forcePreview = false) {
            if (!forcePreview && (!state.impactSound || !canPlayAudioOnThisView())) return;
            if (forcePreview && (state.isMuted || state.volume <= 0)) return;

            unlockAudio(false);
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const volRatio = Math.max(0, Math.min(1, state.volume / 100));

            // マスター音量ノード（最大3.2倍ゲインでサチュレーターへ突っ込み、リミッターで音圧最大化）
            const outputGain = audioCtx.createGain();
            outputGain.gain.setValueAtTime(volRatio * 1.35, now);
            outputGain.connect(audioCtx.destination);

            // マスターリミッター（デジタルクリップを防ぎつつ限界まで音量を持ち上げる）
            const limiter = audioCtx.createDynamicsCompressor();
            limiter.threshold.setValueAtTime(-3.0, now);
            limiter.knee.setValueAtTime(4.0, now);
            limiter.ratio.setValueAtTime(20.0, now);
            limiter.attack.setValueAtTime(0.001, now);
            limiter.release.setValueAtTime(0.18, now);
            limiter.connect(outputGain);

            // サチュレーションノード（ノートPCや小型スピーカーでも「どぅーん！」の輪郭が爆音で響く）
            const shaper = audioCtx.createWaveShaper();
            shaper.curve = createSaturationCurve(42);
            shaper.oversample = '4x';
            shaper.connect(limiter);

            // サミングバス（各レイヤーを強力にドライブ）
            const preDrive = audioCtx.createGain();
            preDrive.gain.setValueAtTime(2.6, now);
            preDrive.connect(shaper);

            // [Layer 1] ハードアタックキック（胸を突き抜けるパンチ）
            const punchOsc = audioCtx.createOscillator();
            const punchGain = audioCtx.createGain();
            punchOsc.type = 'sine';
            punchOsc.frequency.setValueAtTime(240, now);
            punchOsc.frequency.exponentialRampToValueAtTime(46, now + 0.085);
            punchOsc.frequency.exponentialRampToValueAtTime(28, now + 0.75);

            punchGain.gain.setValueAtTime(0.001, now);
            punchGain.gain.linearRampToValueAtTime(1.25, now + 0.004);
            punchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

            punchOsc.connect(punchGain);
            punchGain.connect(preDrive);
            punchOsc.start(now);
            punchOsc.stop(now + 0.9);

            // [Layer 2] 重低音サブベース（どぅーーーーん！という地響きロングリリース）
            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.type = 'triangle';
            subOsc.frequency.setValueAtTime(84, now);
            subOsc.frequency.exponentialRampToValueAtTime(38, now + 0.32);
            subOsc.frequency.exponentialRampToValueAtTime(23, now + 2.7);

            const subFilter = audioCtx.createBiquadFilter();
            subFilter.type = 'lowpass';
            subFilter.frequency.setValueAtTime(220, now);
            subFilter.frequency.exponentialRampToValueAtTime(85, now + 2.5);

            subGain.gain.setValueAtTime(0.001, now);
            subGain.gain.linearRampToValueAtTime(1.2, now + 0.015);
            subGain.gain.setValueAtTime(1.05, now + 0.28);
            subGain.gain.exponentialRampToValueAtTime(0.0008, now + 2.9);

            subOsc.connect(subFilter);
            subFilter.connect(subGain);
            subGain.connect(preDrive);
            subOsc.start(now);
            subOsc.stop(now + 3.0);

            // [Layer 3] 1オクターブ上のボディ補強（会場の遠い席まで低音を届ける倍音成分）
            const bodyOsc = audioCtx.createOscillator();
            const bodyGain = audioCtx.createGain();
            bodyOsc.type = 'sine';
            bodyOsc.frequency.setValueAtTime(135, now);
            bodyOsc.frequency.exponentialRampToValueAtTime(68, now + 0.45);
            bodyOsc.frequency.exponentialRampToValueAtTime(46, now + 2.0);

            bodyGain.gain.setValueAtTime(0.001, now);
            bodyGain.gain.linearRampToValueAtTime(0.75, now + 0.01);
            bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 2.1);

            bodyOsc.connect(bodyGain);
            bodyGain.connect(preDrive);
            bodyOsc.start(now);
            bodyOsc.stop(now + 2.2);

            // [Layer 4] インパクト瞬間のシネマティック衝撃ノイズ
            const bufferSize = audioCtx.sampleRate * 0.28;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.05));
            }

            const noiseSource = audioCtx.createBufferSource();
            noiseSource.buffer = noiseBuffer;

            const noiseFilter = audioCtx.createBiquadFilter();
            noiseFilter.type = 'bandpass';
            noiseFilter.frequency.setValueAtTime(520, now);
            noiseFilter.Q.setValueAtTime(0.9, now);

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.85, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);

            noiseSource.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(preDrive);
            noiseSource.start(now);
        }

        function testKickImpact() {
            unlockAudio(false);
            if (state.isMuted || state.volume <= 0) {
                showToast('現在ミュートまたは音量0%になっています', 'warn');
                return;
            }
            playKickImpact(true);
            triggerVisualImpact();
            showToast(`キックインパクト音（音量 ${state.volume}%）を再生しました`, 'info');
        }

        /**
         * =========================================================================
         * 3. 状態管理 & 画面間リアルタイム同期 (BroadcastChannel + localStorage)
         * =========================================================================
         */
        const urlParams = new URLSearchParams(window.location.search);
        const isAudienceView = urlParams.get('view') === 'audience';
        let isPreviewMode = false;

        const CHANNEL_NAME = 'school_game_event_timer_sync_v1';
        const STORAGE_KEY = 'school_game_event_timer_state_v1';
        const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(CHANNEL_NAME) : null;

        // 初期状態オブジェクト
        let state = {
            timerMode: 'duration',      // 'duration' (指定時間) | 'target' (指定時刻)
            totalDurationMs: 5 * 60 * 1000,
            remainingMs: 5 * 60 * 1000,
            endTimestamp: null,         // 動作中の終了予定UNIXタイムスタンプ(ms)
            targetTimeStr: '',          // 'HH:MM' 形式の目標時刻
            isRunning: false,
            isZeroTriggered: false,
            subtitle: 'NEXT MATCH STARTING IN',
            badge: 'STANDBY',
            zeroMessage: 'TIME UP / START!',
            volume: 90,                 // マスター音量 (0〜100%)
            isMuted: false,             // ミュート状態
            impactSound: true,
            tickSound: true,
            visualImpact: true,
            audienceSound: false,       // 別窓（みんなに見せる画面）でも音を鳴らすか
            updatedAt: Date.now()
        };

        let lastSecondBeeped = null;

        // 状態の保存と他ウィンドウへのブロードキャスト（管理者側のみ実行）
        function broadcastState() {
            if (isAudienceView) return;
            state.updatedAt = Date.now();
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) { }
            if (bc) {
                bc.postMessage({ type: 'SYNC_STATE', payload: state });
            }
        }

        // 他ウィンドウからの状態受信
        function applyRemoteState(newState) {
            if (!newState) return;
            const wasZero = state.isZeroTriggered;
            state = { ...state, ...newState };
            syncAdminInputsFromState();

            // 観客画面側でも0になった瞬間の演出を発火
            if (!wasZero && state.isZeroTriggered) {
                onReachZero(false);
            }
            renderStage();
        }

        if (bc) {
            bc.onmessage = (event) => {
                if (event.data && event.data.type === 'SYNC_STATE') {
                    applyRemoteState(event.data.payload);
                } else if (event.data && event.data.type === 'REQUEST_SYNC' && !isAudienceView) {
                    broadcastState();
                }
            };
        }

        // localStorageイベントによるフォールバック同期（file:// プロトコル等でも動作）
        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY && e.newValue) {
                try {
                    applyRemoteState(JSON.parse(e.newValue));
                } catch (err) { }
            }
        });

        /**
         * =========================================================================
         * 4. 画面モード切替（管理者画面 / プレビューモード / みんなに見せる別窓）
         * =========================================================================
         */
        function initViewMode() {
            const adminPanel = document.getElementById('admin-panel');
            const audienceBanner = document.getElementById('audience-audio-banner');

            if (isAudienceView) {
                // みんなに見せる専用ウィンドウとして起動された場合
                adminPanel.classList.add('hidden');
                audienceBanner.classList.remove('hidden');
                document.title = 'STAGE DISPLAY // GAME EVENT COUNTDOWN';

                // 既存の状態をlocalStorageから復元し、管理者画面に最新状態をリクエスト
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) applyRemoteState(JSON.parse(saved));
                } catch (e) { }

                if (bc) {
                    bc.postMessage({ type: 'REQUEST_SYNC' });
                }
            } else {
                // 管理者画面として起動
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        state = { ...state, ...parsed };
                    }
                } catch (e) { }

                syncAdminInputsFromState();
                initDefaultTargetTimeInput();
                renderQuickTargetButtons();
                broadcastState();
            }
        }

        // 管理者画面をそのままフルスクリーン風のプレビュー表示へ切り替え
        function enterPreviewMode() {
            if (isAudienceView) return;
            unlockAudio(false);
            isPreviewMode = true;

            document.getElementById('admin-panel').classList.add('hidden');
            const hint = document.getElementById('preview-exit-hint');
            hint.classList.remove('hidden');
            hint.classList.add('flex');
            hint.style.opacity = '1';

            // 4秒後にヒントを薄くしてステージ表示を邪魔しないようにする
            clearTimeout(window._hintTimer);
            window._hintTimer = setTimeout(() => {
                if (isPreviewMode) hint.style.opacity = '0.25';
            }, 4000);

            // ブラウザのフルスクリーンAPIも試行（ユーザー操作起点なので成功しやすい）
            if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => { });
            }
        }

        // プレビュー表示から管理者画面へ戻る
        function exitPreviewMode() {
            if (!isPreviewMode) return;
            isPreviewMode = false;

            document.getElementById('admin-panel').classList.remove('hidden');
            const hint = document.getElementById('preview-exit-hint');
            hint.classList.add('hidden');
            hint.classList.remove('flex');

            if (document.fullscreenElement && document.exitFullscreen) {
                document.exitFullscreen().catch(() => { });
            }
        }

        // キーボードショートカット（Esc または H キーでプレビュー解除）
        window.addEventListener('keydown', (e) => {
            // テキスト入力中はHキー等のショートカットを誤爆させない
            const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
            const isTyping = tag === 'input' || tag === 'textarea';

            if (e.key === 'Escape') {
                if (isPreviewMode) {
                    e.preventDefault();
                    exitPreviewMode();
                }
            } else if ((e.key === 'h' || e.key === 'H') && !isTyping) {
                if (isPreviewMode) {
                    e.preventDefault();
                    exitPreviewMode();
                } else if (!isAudienceView) {
                    // 管理者画面でHキーを押すとプレビューへ入るトグル動作も便利
                    e.preventDefault();
                    enterPreviewMode();
                }
            } else if (e.code === 'Space' && !isTyping && !isAudienceView) {
                e.preventDefault();
                toggleTimer();
            }
        });

        // ブラウザ側のEscキーでフルスクリーンだけ解除された場合もプレビュー状態を同期解除
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && isPreviewMode) {
                exitPreviewMode();
            }
        });

        // みんなに見せる画面を別ウィンドウ/タブで開く
        function openAudienceWindow() {
            unlockAudio(false);
            broadcastState();
            const baseUrl = window.location.href.split('?')[0];
            const audienceUrl = `${baseUrl}?view=audience`;
            const win = window.open(audienceUrl, 'GameEventStageDisplay', 'width=1280,height=720');
            if (win) {
                showToast('「みんなに見せる画面」を別ウィンドウで開きました。プロジェクター画面へ移動してください。', 'success');
            } else {
                showToast('ポップアップがブロックされました。ブラウザの許可設定を確認してください。', 'warn');
            }
        }

        /**
         * =========================================================================
         * 5. タイマー制御ロジック（指定時間モード & 指定時刻モード）
         * =========================================================================
         */
        function switchTimerMode(mode) {
            state.timerMode = mode;
            const tabDur = document.getElementById('tab-duration');
            const tabTar = document.getElementById('tab-target');
            const panelDur = document.getElementById('panel-duration');
            const panelTar = document.getElementById('panel-target');

            if (mode === 'duration') {
                tabDur.className = 'py-2 px-3 rounded-lg text-xs sm:text-sm font-bold transition bg-cyan-500 text-slate-950 shadow cursor-pointer';
                tabTar.className = 'py-2 px-3 rounded-lg text-xs sm:text-sm font-bold transition text-slate-400 hover:text-white cursor-pointer';
                panelDur.classList.remove('hidden');
                panelTar.classList.add('hidden');
            } else {
                tabTar.className = 'py-2 px-3 rounded-lg text-xs sm:text-sm font-bold transition bg-cyan-500 text-slate-950 shadow cursor-pointer';
                tabDur.className = 'py-2 px-3 rounded-lg text-xs sm:text-sm font-bold transition text-slate-400 hover:text-white cursor-pointer';
                panelTar.classList.remove('hidden');
                panelDur.classList.add('hidden');
                renderQuickTargetButtons();
            }
            broadcastState();
            renderStage();
        }

        // 指定時間セット（プリセット）
        function setPresetDuration(mins, secs) {
            document.getElementById('input-minutes').value = mins;
            document.getElementById('input-seconds').value = secs;
            applyDurationInput();
        }

        // 指定時間入力の反映
        function applyDurationInput() {
            const mins = Math.max(0, parseInt(document.getElementById('input-minutes').value || '0', 10));
            const secs = Math.max(0, Math.min(59, parseInt(document.getElementById('input-seconds').value || '0', 10)));
            const totalMs = (mins * 60 + secs) * 1000;

            if (totalMs <= 0) {
                showToast('1秒以上の時間を指定してください', 'warn');
                return;
            }

            state.timerMode = 'duration';
            state.isRunning = false;
            state.isZeroTriggered = false;
            state.endTimestamp = null;
            state.targetTimeStr = '';
            state.totalDurationMs = totalMs;
            state.remainingMs = totalMs;
            lastSecondBeeped = null;

            updateStartPauseButton();
            broadcastState();
            renderStage();
            showToast(`${mins}分${secs > 0 ? secs + '秒' : ''}にセットしました`, 'info');
        }

        // 初期の目標時刻入力欄（現在時刻の次のキリの良い5分後〜15分後）
        function initDefaultTargetTimeInput() {
            const input = document.getElementById('input-target-time');
            if (!input || input.value) return;
            const now = new Date();
            now.setMinutes(now.getMinutes() + 10);
            const hh = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            input.value = `${hh}:${mm}`;
        }

        // 現在時刻から次のキリの良い時刻ボタン（+5分、次の15分刻み、次の00分）を生成
        function renderQuickTargetButtons() {
            const container = document.getElementById('quick-target-buttons');
            if (!container) return;

            const now = new Date();
            const candidates = [];

            // 1) 次の5分刻み
            const next5 = new Date(now);
            next5.setSeconds(0, 0);
            const add5 = 5 - (next5.getMinutes() % 5);
            next5.setMinutes(next5.getMinutes() + (add5 === 0 ? 5 : add5));
            candidates.push(next5);

            // 2) 次の15分刻み
            const next15 = new Date(now);
            next15.setSeconds(0, 0);
            const add15 = 15 - (next15.getMinutes() % 15);
            next15.setMinutes(next15.getMinutes() + (add15 < 5 ? add15 + 15 : add15));
            if (next15.getTime() !== next5.getTime()) candidates.push(next15);

            // 3) 次の正時（00分）または30分
            const next30 = new Date(now);
            next30.setSeconds(0, 0);
            const add30 = 30 - (next30.getMinutes() % 30);
            next30.setMinutes(next30.getMinutes() + (add30 < 10 ? add30 + 30 : add30));
            if (!candidates.some(d => d.getTime() === next30.getTime())) candidates.push(next30);

            container.innerHTML = candidates.slice(0, 3).map(d => {
                const hh = String(d.getHours()).padStart(2, '0');
                const mm = String(d.getMinutes()).padStart(2, '0');
                const str = `${hh}:${mm}`;
                return `<button onclick="setQuickTargetTime('${str}')" class="py-1.5 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-mono font-bold text-cyan-300 border border-slate-700 transition cursor-pointer">${str} に0</button>`;
            }).join('');
        }

        function setQuickTargetTime(timeStr) {
            document.getElementById('input-target-time').value = timeStr;
            startTargetTimeCountdown();
        }

        // 指定時刻（HH:MM）に向けて逆算カウントダウン開始
        function startTargetTimeCountdown() {
            unlockAudio(false);
            const timeStr = document.getElementById('input-target-time').value;
            if (!timeStr) {
                showToast('目標時刻を入力してください', 'warn');
                return;
            }

            const [hh, mm] = timeStr.split(':').map(Number);
            const now = new Date();
            const target = new Date(now);
            target.setHours(hh, mm, 0, 0);

            // すでに今日のその時刻を過ぎていたら翌日のその時刻として扱う
            if (target.getTime() <= now.getTime()) {
                target.setDate(target.getDate() + 1);
            }

            const diffMs = target.getTime() - now.getTime();
            state.timerMode = 'target';
            state.targetTimeStr = timeStr;
            state.endTimestamp = target.getTime();
            state.totalDurationMs = diffMs;
            state.remainingMs = diffMs;
            state.isRunning = true;
            state.isZeroTriggered = false;
            lastSecondBeeped = null;

            updateStartPauseButton();
            broadcastState();
            renderStage();
            showToast(`${timeStr} に0になるタイマーを開始しました`, 'success');
        }

        // スタート / 一時停止トグル
        function toggleTimer() {
            unlockAudio(false);

            if (state.isRunning) {
                // 一時停止
                if (state.endTimestamp) {
                    state.remainingMs = Math.max(0, state.endTimestamp - Date.now());
                }
                state.isRunning = false;
                state.endTimestamp = null;
            } else {
                // 開始・再開
                if (state.timerMode === 'target' && state.targetTimeStr) {
                    startTargetTimeCountdown();
                    return;
                }
                if (state.remainingMs <= 0) {
                    state.remainingMs = state.totalDurationMs;
                    state.isZeroTriggered = false;
                    lastSecondBeeped = null;
                }
                state.isRunning = true;
                state.isZeroTriggered = false;
                state.endTimestamp = Date.now() + state.remainingMs;
            }

            updateStartPauseButton();
            broadcastState();
            renderStage();
        }

        // リセット
        function resetTimer() {
            state.isRunning = false;
            state.isZeroTriggered = false;
            state.endTimestamp = null;
            lastSecondBeeped = null;

            if (state.timerMode === 'target' && state.targetTimeStr) {
                // 指定時刻モードの場合は現在の残り時間を再計算して待機
                const [hh, mm] = state.targetTimeStr.split(':').map(Number);
                const now = new Date();
                const target = new Date(now);
                target.setHours(hh, mm, 0, 0);
                if (target.getTime() <= now.getTime()) target.setDate(target.getDate() + 1);
                state.totalDurationMs = target.getTime() - now.getTime();
                state.remainingMs = state.totalDurationMs;
            } else {
                state.remainingMs = state.totalDurationMs;
            }

            updateStartPauseButton();
            broadcastState();
            renderStage();
        }

        // 残り時間に秒数を追加（+1分など）
        function addExtraSeconds(sec) {
            const addMs = sec * 1000;
            state.isZeroTriggered = false;
            lastSecondBeeped = null;

            if (state.isRunning && state.endTimestamp) {
                state.endTimestamp += addMs;
                state.remainingMs = state.endTimestamp - Date.now();
                state.totalDurationMs = Math.max(state.totalDurationMs, state.remainingMs);
            } else {
                state.remainingMs += addMs;
                state.totalDurationMs = Math.max(state.totalDurationMs, state.remainingMs);
            }

            broadcastState();
            renderStage();
            showToast(`+${sec}秒 追加しました`, 'info');
        }

        // テキスト・設定の更新
        function updateTexts() {
            state.subtitle = document.getElementById('input-subtitle').value;
            state.badge = document.getElementById('input-badge').value;
            state.zeroMessage = document.getElementById('input-zero-msg').value;
            broadcastState();
            renderStage();
        }

        function applyTextTemplate(badge, subtitle, zeroMsg) {
            document.getElementById('input-badge').value = badge;
            document.getElementById('input-subtitle').value = subtitle;
            document.getElementById('input-zero-msg').value = zeroMsg;
            updateTexts();
        }

        function syncSettings() {
            state.impactSound = document.getElementById('chk-impact-sound').checked;
            state.tickSound = document.getElementById('chk-tick-sound').checked;
            state.visualImpact = document.getElementById('chk-visual-impact').checked;
            state.audienceSound = document.getElementById('chk-audience-sound').checked;
            broadcastState();
        }

        // 音量スライダー操作
        function updateVolume(val) {
            const num = Math.max(0, Math.min(100, parseInt(val, 10) || 0));
            state.volume = num;
            if (num > 0 && state.isMuted) {
                state.isMuted = false;
            }
            updateVolumeUI();
            broadcastState();
        }

        // ミュート切り替えボタン
        function toggleMute() {
            state.isMuted = !state.isMuted;
            updateVolumeUI();
            broadcastState();
        }

        function updateVolumeUI() {
            if (isAudienceView) return;
            const slider = document.getElementById('input-volume');
            const label = document.getElementById('volume-value-label');
            const muteBtn = document.getElementById('btn-mute-toggle');
            if (!slider || !label || !muteBtn) return;

            slider.value = state.volume;
            if (state.isMuted || state.volume === 0) {
                label.textContent = 'MUTE';
                label.className = 'font-mono text-xs font-black text-rose-400';
                muteBtn.textContent = '🔇';
            } else {
                label.textContent = `${state.volume}%`;
                label.className = 'font-mono text-xs font-black text-cyan-300';
                muteBtn.textContent = state.volume >= 50 ? '🔊' : '🔉';
            }
        }

        function syncAdminInputsFromState() {
            if (isAudienceView) return;
            const subEl = document.getElementById('input-subtitle');
            if (subEl && document.activeElement !== subEl) subEl.value = state.subtitle;
            const badgeEl = document.getElementById('input-badge');
            if (badgeEl && document.activeElement !== badgeEl) badgeEl.value = state.badge;
            const zeroEl = document.getElementById('input-zero-msg');
            if (zeroEl && document.activeElement !== zeroEl) zeroEl.value = state.zeroMessage;

            document.getElementById('chk-impact-sound').checked = state.impactSound;
            document.getElementById('chk-tick-sound').checked = state.tickSound;
            document.getElementById('chk-visual-impact').checked = state.visualImpact;
            document.getElementById('chk-audience-sound').checked = !!state.audienceSound;
            updateVolumeUI();
            updateStartPauseButton();
        }

        function updateStartPauseButton() {
            const btn = document.getElementById('btn-start-pause');
            const icon = document.getElementById('btn-start-icon');
            const label = document.getElementById('btn-start-label');
            if (!btn) return;

            if (state.isRunning) {
                btn.className = 'col-span-2 py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm sm:text-base flex items-center justify-center gap-1.5 shadow-[0_0_18px_rgba(245,158,11,0.35)] transition active:scale-95 cursor-pointer';
                icon.textContent = '⏸';
                label.textContent = '一時停止';
            } else {
                btn.className = 'col-span-2 py-2.5 px-4 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-sm sm:text-base flex items-center justify-center gap-1.5 shadow-[0_0_18px_rgba(16,185,129,0.35)] transition active:scale-95 cursor-pointer';
                icon.textContent = '▶';
                label.textContent = 'スタート';
            }
        }

        /**
         * =========================================================================
         * 6. 0秒到達演出 & 高精度レンダリングループ
         * =========================================================================
         */
        function triggerVisualImpact() {
            if (!state.visualImpact) return;
            const flash = document.getElementById('flash-overlay');
            const stageContent = document.getElementById('stage-content');

            flash.classList.remove('animate-flash');
            stageContent.classList.remove('animate-impact');

            // リフロー強制でアニメーション再発火
            void flash.offsetWidth;
            void stageContent.offsetWidth;

            flash.classList.add('animate-flash');
            stageContent.classList.add('animate-impact');
        }

        function onReachZero(shouldBroadcast = true) {
            state.isRunning = false;
            state.isZeroTriggered = true;
            state.remainingMs = 0;
            state.endTimestamp = null;

            playKickImpact();
            triggerVisualImpact();
            updateStartPauseButton();

            if (shouldBroadcast) {
                broadcastState();
            }
        }

        function formatClock(dateObj) {
            const h = String(dateObj.getHours()).padStart(2, '0');
            const m = String(dateObj.getMinutes()).padStart(2, '0');
            const s = String(dateObj.getSeconds()).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function formatTimerMs(ms) {
            const totalSec = Math.ceil(Math.max(0, ms) / 1000);
            const hours = Math.floor(totalSec / 3600);
            const minutes = Math.floor((totalSec % 3600) / 60);
            const seconds = totalSec % 60;

            if (hours > 0) {
                return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function renderStage() {
            const now = Date.now();
            const nowDate = new Date(now);

            // 現在時刻の更新
            const clockStr = formatClock(nowDate);
            document.getElementById('stage-clock').textContent = clockStr;
            const adminClock = document.getElementById('admin-clock');
            if (adminClock) adminClock.textContent = clockStr;

            // 残り時間の算出
            if (state.isRunning && state.endTimestamp) {
                state.remainingMs = Math.max(0, state.endTimestamp - now);

                // 残り3・2・1秒の予告ビープ音
                const ceilSec = Math.ceil(state.remainingMs / 1000);
                if (ceilSec >= 1 && ceilSec <= 3 && lastSecondBeeped !== ceilSec) {
                    lastSecondBeeped = ceilSec;
                    playCountdownBeep(ceilSec);
                }

                // 0到達判定
                if (state.remainingMs <= 0 && !state.isZeroTriggered) {
                    onReachZero(true);
                }
            }

            // テキスト要素の反映
            document.getElementById('stage-subtitle').textContent = state.subtitle || ' ';
            document.getElementById('stage-badge').textContent = state.badge || 'EVENT';

            // 目標時刻バッジ・終了予定時刻の表示
            const targetBadge = document.getElementById('stage-target-info');
            const endClockEl = document.getElementById('stage-end-clock');
            if (state.timerMode === 'target' && state.targetTimeStr) {
                targetBadge.textContent = `TARGET ${state.targetTimeStr}`;
                targetBadge.classList.remove('hidden');
                endClockEl.textContent = `${state.targetTimeStr}:00`;
            } else {
                targetBadge.classList.add('hidden');
                if (state.isRunning && state.endTimestamp) {
                    endClockEl.textContent = formatClock(new Date(state.endTimestamp));
                } else if (state.remainingMs > 0) {
                    endClockEl.textContent = formatClock(new Date(now + state.remainingMs));
                } else {
                    endClockEl.textContent = '--:--:--';
                }
            }

            // タイマー数字とカラー演出（通常シアン -> 残り30秒オレンジ -> 残り10秒レッド）
            const timerEl = document.getElementById('timer-display');
            const glowEl = document.getElementById('ambient-glow');
            const progressEl = document.getElementById('stage-progress-bar');
            const zeroBox = document.getElementById('zero-message-box');
            const zeroMsgText = document.getElementById('zero-message-text');

            const formattedTime = formatTimerMs(state.remainingMs);
            timerEl.textContent = formattedTime;

            // 1時間以上の表示(HH:MM:SS)時はフォントサイズを少し自動調整
            if (formattedTime.length > 5) {
                timerEl.style.fontSize = 'clamp(3.2rem, 13vw, 11.5rem)';
            } else {
                timerEl.style.fontSize = 'clamp(4.5rem, 18vw, 15rem)';
            }

            const secLeft = Math.ceil(state.remainingMs / 1000);
            timerEl.classList.remove('neon-text-warn', 'neon-text-danger');

            if (state.isZeroTriggered || secLeft === 0) {
                timerEl.classList.add('neon-text-danger');
                glowEl.className = 'w-[70vw] h-[70vw] max-w-[850px] max-h-[850px] rounded-full bg-pink-600/20 blur-[120px] transition-colors duration-500';
                progressEl.className = 'h-full bg-gradient-to-r from-pink-600 to-rose-500 rounded-full transition-all duration-200 shadow-[0_0_15px_rgba(255,0,85,0.8)]';
                zeroBox.classList.remove('hidden');
                zeroMsgText.textContent = state.zeroMessage || 'TIME UP!';
            } else if (secLeft <= 10) {
                timerEl.classList.add('neon-text-danger');
                glowEl.className = 'w-[65vw] h-[65vw] max-w-[820px] max-h-[820px] rounded-full bg-rose-600/15 blur-[110px] transition-colors duration-500';
                progressEl.className = 'h-full bg-gradient-to-r from-rose-500 to-pink-500 rounded-full transition-all duration-200 shadow-[0_0_12px_rgba(255,0,85,0.6)]';
                zeroBox.classList.add('hidden');
            } else if (secLeft <= 30) {
                timerEl.classList.add('neon-text-warn');
                glowEl.className = 'w-[65vw] h-[65vw] max-w-[820px] max-h-[820px] rounded-full bg-amber-500/15 blur-[110px] transition-colors duration-500';
                progressEl.className = 'h-full bg-gradient-to-r from-amber-400 to-orange-500 rounded-full transition-all duration-200 shadow-[0_0_12px_rgba(255,170,0,0.6)]';
                zeroBox.classList.add('hidden');
            } else {
                glowEl.className = 'w-[65vw] h-[65vw] max-w-[820px] max-h-[820px] rounded-full bg-cyan-500/10 blur-[110px] transition-colors duration-500';
                progressEl.className = 'h-full bg-gradient-to-r from-cyan-400 via-blue-500 to-cyan-300 rounded-full transition-all duration-200 shadow-[0_0_12px_rgba(0,240,255,0.6)]';
                zeroBox.classList.add('hidden');
            }

            // プログレスバー幅
            const ratio = state.totalDurationMs > 0
                ? Math.max(0, Math.min(100, (state.remainingMs / state.totalDurationMs) * 100))
                : 0;
            progressEl.style.width = `${ratio}%`;
        }

        // トースト通知（alertの代替）
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            const colors = {
                info: 'border-cyan-500/50 bg-slate-900/95 text-cyan-200',
                success: 'border-emerald-500/50 bg-slate-900/95 text-emerald-200',
                warn: 'border-amber-500/50 bg-slate-900/95 text-amber-200'
            };
            el.className = `px-4 py-2.5 rounded-xl border ${colors[type] || colors.info} text-xs sm:text-sm font-bold shadow-xl backdrop-blur-md transition-all duration-300 transform translate-y-0 opacity-100`;
            el.textContent = message;
            container.appendChild(el);

            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-8px)';
                setTimeout(() => el.remove(), 300);
            }, 3200);
        }

        // アニメーションループ開始
        function mainLoop() {
            renderStage();
            requestAnimationFrame(mainLoop);
        }

        window.addEventListener('DOMContentLoaded', () => {
            initViewMode();
            requestAnimationFrame(mainLoop);
            // 1分ごとに目標時刻のクイックボタンを更新
            setInterval(renderQuickTargetButtons, 60000);
        });
    </script>
</body>

</html>
